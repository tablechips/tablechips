<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14110E">
<title>TableChips</title>
<style>
/*
  The bridge page: three seconds of somebody's life, between scanning a code
  and playing. It carries the identity in colour and shape but not in fonts —
  embedding them here would make the very first page of the product the
  slowest, and the client one tap away brings them anyway.
*/
:root {
  --bg: #14110E; --surface: #1F1A16; --surfaceHigh: #2A231D; --line: #3A312A;
  --lineStrong: #4A3E33; --text: #F2EAE0; --text2: #A99C8E; --accent: #C69A4E;
  --onAccent: #14110E;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.4;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 24px 18px calc(24px + env(safe-area-inset-bottom, 0px));
  text-align: center;
}
.mark { width: 48px; height: 48px; border-radius: 50%; border: 6px solid var(--accent);
        display: flex; align-items: center; justify-content: center; }
.mark > i { width: 16px; height: 16px; background: var(--accent); transform: rotate(45deg); }
h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
p { margin: 0; color: var(--text2); font-size: 14px; text-wrap: pretty; max-width: 22rem; }
.code { font-family: ui-monospace, monospace; font-weight: 600; letter-spacing: .12em;
        color: var(--accent); }
.qr { width: 172px; height: 172px; background: var(--text); border-radius: 12px; padding: 8px; }
a.action, button.action {
  display: flex; align-items: center; justify-content: center;
  width: 100%; max-width: 22rem; min-height: 64px; padding: 0 18px;
  border-radius: 13px; border: 1px solid var(--lineStrong); background: var(--surface);
  color: var(--text); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
}
a.action:active, button.action:active { background: var(--surfaceHigh); }
a.primary { background: var(--accent); border-color: var(--accent); color: var(--onAccent); }
.langs { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--line);
         border-radius: 9px; padding: 3px; }
.langs > button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 7px;
                  background: transparent; color: var(--text2); font: inherit; font-weight: 600;
                  font-size: 13px; cursor: pointer; }
.langs > button.on { background: var(--accent); color: var(--onAccent); }
</style>
</head>
<body>

<div class="mark"><i></i></div>
<h1>TableChips</h1>
<p><span data-i18n="table"></span> <span class="code" id="room"></span></p>

<img class="qr" id="qr" alt="" src="/qr.svg">

<a class="action primary" id="app" hidden data-i18n="open.app"></a>
<a class="action" id="web" href="/" data-i18n="open.web"></a>
<p data-i18n="hint"></p>
<div class="langs" id="langs"></div>

<script>
// The applicationId of the app this bridge opens. It is the one irreversible
// name in the project, so it is written here in full rather than guessed.
const PACKAGE = "io.github.victormico.tablechips";

const DICT = {
  ca: {
    "table": "Taula",
    "open.app": "Obrir a l'app",
    "open.web": "Jugar al navegador",
    "hint": "Si tens l'app instal·lada, el primer botó t'hi porta. Si no, el navegador ja et serveix: no cal instal·lar res.",
    "pass": "Ensenya aquest codi a qui arribe tard."
  },
  es: {
    "table": "Mesa",
    "open.app": "Abrir en la app",
    "open.web": "Jugar en el navegador",
    "hint": "Si tienes la app instalada, el primer botón te lleva. Si no, con el navegador basta: no hace falta instalar nada.",
    "pass": "Enseña este código a quien llegue tarde."
  },
  en: {
    "table": "Table",
    "open.app": "Open in the app",
    "open.web": "Play in the browser",
    "hint": "If you have the app, the first button opens it. If you do not, the browser is enough: there is nothing to install.",
    "pass": "Show this code to whoever turns up late."
  }
};

const LANGS = ["ca", "es", "en"];
let lang = pick();

function pick() {
  try {
    const stored = localStorage.getItem("tablechips.lang");
    if (stored && DICT[stored]) return stored;
  } catch (e) {}
  for (const tag of (navigator.languages || [navigator.language || "ca"])) {
    const base = String(tag).toLowerCase().split("-")[0];
    if (DICT[base]) return base;
  }
  return "ca";
}

function apply() {
  document.documentElement.lang = lang;
  for (const node of document.querySelectorAll("[data-i18n]")) {
    node.textContent = DICT[lang][node.dataset.i18n] || DICT.en[node.dataset.i18n] || "";
  }
  document.getElementById("langs").replaceChildren(...LANGS.map((code) => {
    const button = document.createElement("button");
    button.textContent = code.toUpperCase();
    if (code === lang) button.className = "on";
    button.onclick = () => {
      lang = code;
      try { localStorage.setItem("tablechips.lang", code); } catch (e) {}
      apply();
    };
    return button;
  }));
}

const room = new URLSearchParams(location.search).get("room") || "";
document.getElementById("room").textContent = room;
if (!room) {
  // The code was not in the link: ask the table what it is called.
  fetch("/health").then((r) => r.json())
    .then((health) => { document.getElementById("room").textContent = health.room || ""; })
    .catch(() => {});
}

/*
  Android only. A verified App Link is impossible here — it would need https
  and a file served from a domain, and this is a phone with no internet — so
  the way in is an intent URI with a fallback: the app if it is installed, the
  web client if it is not. iOS has neither the scheme nor an app, so it gets
  the browser straight away, which is the whole promise of the product.
*/
if (/android/i.test(navigator.userAgent)) {
  const host = location.hostname;
  const port = location.port || "80";
  const fallback = encodeURIComponent(location.protocol + "//" + location.host + "/");
  const link = document.getElementById("app");
  link.href = "intent://join?host=" + encodeURIComponent(host) +
    "&port=" + encodeURIComponent(port) +
    (room ? "&room=" + encodeURIComponent(room) : "") +
    "#Intent;scheme=tablechips;package=" + PACKAGE +
    ";S.browser_fallback_url=" + fallback + ";end";
  link.hidden = false;
}

apply();
</script>
</body>
</html>
