/*
  Direction "Refugi": night at a mountain hut. Warm smoke black, dark wood
  surfaces and a single metal, matt brass. The accent is scarce on purpose —
  one filled brass action per screen and nothing else.

  Dark only. A light mode has not been designed and guessing one would break
  the identity, so there is no prefers-color-scheme branch here.
*/
:root {
  --bg: #14110E;
  --surface: #1F1A16;
  --surfaceHigh: #2A231D;
  --line: #3A312A;
  --lineStrong: #4A3E33;
  --lineAccent: #6B5A3E;
  --lineDanger: #5A3B33;
  --text: #F2EAE0;
  --text2: #A99C8E;
  --accent: #C69A4E;
  --accentHover: #D8AC5E;
  --gain: #86A96B;
  --loss: #CC5B42;
  --warn: #EBC15E;
  --onAccent: #14110E;
  /* Chips, as in the app's theme: darker than gain and loss so a red 5 does not
     read as money lost, and the 100 a dull gold, because black vanishes on a
     dark card and leaves a hollow outline. */
  --chip1: #E6DCCB;
  --chip5: #9E4436;
  --chip25: #4F7D55;
  --chip50: #4D6F8F;
  --chip100: #8E7040;

  --sans: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --side: 18px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Class selectors below set `display`, which outranks the user agent rule. */
[hidden] { display: none !important; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- frame */
.view { display: none; flex-direction: column; height: 100dvh; max-width: 520px; margin: 0 auto; }
.view.on { display: flex; }
.head {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 14px var(--side) 12px; border-bottom: 1px solid var(--surfaceHigh);
}
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px var(--side) 4px; display: flex; flex-direction: column; gap: 14px;
}
.actions {
  flex: none; padding: 14px var(--side) calc(20px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--surfaceHigh); display: flex; flex-direction: column; gap: 9px;
}
.actions .row { display: flex; gap: 9px; }

/* ---------------------------------------------------------------- brand */
.mark { border-radius: 50%; border-style: solid; border-color: var(--accent);
        display: flex; align-items: center; justify-content: center; flex: none; }
.mark > i { background: var(--accent); transform: rotate(45deg); display: block; }
.mark.s18 { width: 18px; height: 18px; border-width: 3px; }
.mark.s18 > i { width: 6px; height: 6px; }
.mark.s72 { width: 72px; height: 72px; border-width: 8px; }
.mark.s72 > i { width: 24px; height: 24px; }

.headTitle { font-weight: 600; font-size: 13px; line-height: 1; }
.headStack { flex: 1; min-width: 0; }
.headStack .t { font-weight: 600; font-size: 15px; line-height: 1.2; }
.headStack .s { font-size: 12px; line-height: 1.25; color: var(--text2); }
.role { font-family: var(--mono); font-size: 11px; font-weight: 500;
        letter-spacing: .1em; text-transform: uppercase; color: var(--gain); }

/* ---------------------------------------------------------------- pieces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.cap { font-family: var(--mono); font-size: 11px; font-weight: 500; line-height: 1;
       letter-spacing: .10em; text-transform: uppercase; color: var(--text2); }

.stackCard { padding: 18px 20px 20px; }
.stackTop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
/*
  A figure is allowed to be enormous, never wider than the phone. The base size
  is the design's; `--fit` is the factor the page sets when the number has more
  digits than that size can hold.
*/
.stackNum { font-family: var(--mono); font-weight: 600; --figure: 72px;
            font-size: calc(var(--figure) * var(--fit, 1)); line-height: 1;
            letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.pchips.bet { color: var(--accent); }
.pchips.nobet { color: var(--text2); }
.chipRow { display: flex; gap: 8px; margin-top: 16px; align-items: flex-end; }
.chipCol { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.chipPile { height: 40px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
.chipPile > i { display: block; width: 34px; height: 4px; border-radius: 2px; }
.chipPile > i.v1 { background: var(--chip1); }
.chipPile > i.v5 { background: var(--chip5); }
.chipPile > i.v25 { background: var(--chip25); }
.chipPile > i.v50 { background: var(--chip50); }
.chipPile > i.v100 { background: var(--chip100); }
.chipPile > i.none { background: none; box-shadow: inset 0 0 0 1px var(--line); }
.chipCol .cv { margin-top: 6px; font-family: var(--mono); font-weight: 500; font-size: 12px;
               font-variant-numeric: tabular-nums; }
.chipCol .cc { font-family: var(--mono); font-size: 11px; color: var(--text2);
               font-variant-numeric: tabular-nums; }
.chipCol.empty .cv, .chipCol.empty .cc { color: var(--line); }

.metrics { display: flex; gap: 12px; }
.metric { flex: 1; padding: 14px 16px 16px; text-align: start;
          font: inherit; color: inherit; cursor: default; }
.metric .v { font-family: var(--mono); font-weight: 600; --figure: 34px;
             font-size: calc(var(--figure) * var(--fit, 1)); line-height: 1;
             font-variant-numeric: tabular-nums; margin-top: 7px; }
button.metric { cursor: pointer; }
button.metric.sel { background: var(--surfaceHigh); border-color: var(--accent); }
button.metric.sel .v { color: var(--accent); }

.note { background: var(--surfaceHigh); border: 1px solid var(--lineAccent); border-radius: 12px;
        padding: 13px 15px; display: flex; gap: 11px; align-items: center; }
.note .bang { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--warn);
              color: var(--warn); font-family: var(--mono); font-weight: 600; font-size: 12px;
              line-height: 14px; text-align: center; flex: none; }
.note .txt { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.45; color: var(--warn);
             text-wrap: pretty; }

.rowsCap { display: flex; align-items: baseline; justify-content: space-between; }
.rows { display: flex; flex-direction: column; gap: 7px; }
.prow { display: flex; align-items: center; gap: 11px; padding: 11px 14px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
.prow.dim { opacity: .72; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot.on { background: var(--gain); }
.dot.me { background: var(--accent); }
.pname { flex: 1; min-width: 0; font-weight: 500; font-size: 15px; line-height: 1.2;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname.self { font-weight: 600; }
.ptag { font-size: 12px; color: var(--text2); flex: none; }
.ptag.bad { color: var(--loss); }
.pchips { font-family: var(--mono); font-weight: 600; font-size: 16px; line-height: 1;
          font-variant-numeric: tabular-nums; flex: none; }
.free { color: var(--text2); font-size: 14px; }

/* ---------------------------------------------------------------- buttons */
button {
  font-family: var(--sans); color: var(--text); background: var(--surface);
  border: 1px solid var(--lineStrong); border-radius: 12px; cursor: pointer;
  font-weight: 600; line-height: 1.15; padding: 0 12px;
}
button:active { background: var(--surfaceHigh); }
button[disabled] { opacity: .4; cursor: default; }
.primary { height: 64px; background: var(--accent); border: none; color: var(--onAccent);
           font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.primary:active { background: var(--accentHover); }
.primary .n { font-family: var(--mono); font-weight: 600; font-size: 19px;
              font-variant-numeric: tabular-nums; }
.secondary { height: 60px; font-size: 16px; flex: 1; }
/* flex: 1 shares a row between buttons; in a column it would squash the one
   button there to nothing, so there it keeps its own height. */
.actions > .secondary, .rows > .secondary { flex: none; }
.danger { border-color: var(--lineDanger); color: var(--loss); }
.iconBtn { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px;
           display: flex; align-items: center; justify-content: center; flex: none; padding: 0; }
.back { width: 11px; height: 11px; border-left: 2px solid var(--text);
        border-bottom: 2px solid var(--text); transform: rotate(45deg); margin-left: 4px; }
.dots { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line);
        display: flex; align-items: center; justify-content: center; gap: 2.5px; padding: 0; }
.dots > i { width: 3px; height: 3px; border-radius: 50%; background: var(--text2); display: block; }
.dots.help { color: var(--text2); font-size: 15px; font-weight: 600; margin-inline-end: 8px; }
.ruleCard { background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
            padding: 12px 14px; font-size: 15px; line-height: 1.4; text-wrap: pretty; }
.ruleCard.strong { border-color: var(--lineAccent); }
.handRow { display: flex; gap: 12px; padding-top: 10px; }
.handRow .rank { width: 20px; flex: none; font-family: var(--mono); font-size: 14px; color: var(--text2); }
.handRow .hn { font-weight: 600; font-size: 15px; }
.handRow .hd { font-size: 13px; color: var(--text2); }
.cards { display: flex; gap: 7px; padding: 3px 0; font-family: var(--mono); font-size: 15px; }
.cards .red { color: var(--loss); }
.handNotes { display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.4; }
.ruleCard.values { font-family: var(--mono); font-size: 14px; line-height: 1.6;
                   font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- amount */
.amountCard { border-color: var(--accent); padding: 18px 20px; }
.amountRow { display: flex; align-items: baseline; gap: 4px; margin-top: 8px; }
.amountNum { font-family: var(--mono); font-weight: 600; --figure: 64px;
             font-size: calc(var(--figure) * var(--fit, 1)); line-height: 1;
             letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.caret { width: 3px; height: 52px; background: var(--accent); align-self: center; flex: none; }
.rest { display: flex; align-items: center; justify-content: space-between; gap: 10px;
        margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.rest .l { font-size: 13px; line-height: 1.3; color: var(--text2); }
.rest .v { font-family: var(--mono); font-weight: 600; font-size: 17px; line-height: 1;
           font-variant-numeric: tabular-nums; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/*
  A browser eats a third of the screen with its own chrome, so the phone this
  was drawn for is not the phone this runs on. The card carrying the figure
  never scrolls away: the keypad gives up its height first, down to the 48 px
  floor, and only then does anything scroll — with the figure stuck to the top,
  because typing an amount you cannot see is worse than no keypad at all.
*/
.pane > .amountCard, .pane > .quickBlock { flex: none; }
.pane > .amountCard { position: sticky; top: -1px; z-index: 2; }
.grid3.pad { flex: 1 1 auto; min-height: 0; grid-auto-rows: 1fr; }
.amountMode > button { flex: 1; }
/* Counting chip by chip: one row per value, taking the keypad's place and,
   like it, giving up height before the figure does. */
.chipPad { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 7px;
           /* Rows keep a finger's height; on a short phone the pad scrolls
              rather than slide its last row under the confirm button. */
           overflow-y: auto; }
.chipLine, .chipPad .row { flex-shrink: 0; }
.chipLine { flex: 1 1 0; min-height: 44px; max-height: 64px; display: flex; align-items: center;
            gap: 10px; padding-left: 14px; background: var(--surface); border: 1px solid var(--line);
            border-radius: 11px; overflow: hidden; }
.chipLine .sw { width: 28px; height: 6px; border-radius: 2px; flex: none; }
.sw.v1 { background: var(--chip1); } .sw.v5 { background: var(--chip5); }
.sw.v25 { background: var(--chip25); } .sw.v50 { background: var(--chip50); }
.sw.v100 { background: var(--chip100); }
.chipLine .v { flex: 1; font-family: var(--mono); font-weight: 500; font-size: 17px;
               font-variant-numeric: tabular-nums; }
.chipLine .c { width: 40px; text-align: center; font-family: var(--mono); font-weight: 600;
               font-size: 20px; font-variant-numeric: tabular-nums; }
.chipLine .c.zero { color: var(--line); }
.chipLine button { width: 56px; align-self: stretch; border: 0; border-radius: 0;
                   background: var(--surfaceHigh); color: var(--text); font-family: var(--mono);
                   font-size: 22px; }
.chipLine button:disabled { color: var(--line); }
.chipPad .row { display: flex; gap: 8px; }
.chipPad .row > .quick { flex: 1; }
.quick { height: 52px; border-radius: 11px; font-size: 14px; padding: 0 6px; }
.quick.n { font-family: var(--mono); font-size: 16px; }
.quick.all { color: var(--warn); }
.key { height: 100%; min-height: 0; max-height: 62px; border-radius: 12px; border-color: var(--line);
       font-family: var(--mono); font-weight: 500; font-size: 26px;
       display: flex; align-items: center; justify-content: center; }
.key.small { font-size: 20px; }
.del { width: 22px; height: 15px; border: 2px solid var(--text); border-radius: 3px;
       position: relative; display: flex; align-items: center; justify-content: center; }
.del > i { width: 9px; height: 2px; background: var(--text); position: absolute; display: block; }

/* ---------------------------------------------------------------- host + log */
.award { padding: 16px 18px 18px; }
.awardTop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.awardTop .v { font-family: var(--mono); font-weight: 600; --figure: 28px;
               font-size: calc(var(--figure) * var(--fit, 1)); line-height: 1;
               color: var(--accent); font-variant-numeric: tabular-nums; }
.awardBtn { height: 58px; background: var(--surfaceHigh); border-color: var(--lineAccent);
            font-size: 16px; display: flex; align-items: center;
            justify-content: space-between; gap: 10px; padding: 0 15px; width: 100%; }
.awardBtn .g { font-family: var(--mono); font-weight: 600; font-size: 16px; color: var(--gain); }
.awardBtn.picked { background: var(--surface); border-color: var(--accent); color: var(--accent); }
.hostHand { display: flex; gap: 9px; }
.hostHand > .secondary { height: 52px; font-size: 14px; }
.hrow { display: flex; align-items: center; gap: 9px; padding: 11px 12px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
.hrow .who { flex: 1; min-width: 0; }
.hrow .who .n { font-weight: 600; font-size: 15px; line-height: 1.2;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .who .s { font-family: var(--mono); font-weight: 500; font-size: 13px; line-height: 1.3;
                color: var(--text2); font-variant-numeric: tabular-nums; }
.hrow .who .s.broke { color: var(--loss); }
.rowBtn { height: 48px; padding: 0 13px; border-radius: 10px; background: var(--surfaceHigh);
          font-size: 13px; flex: none; }
.rowBtn.want { border-color: var(--lineAccent); color: var(--warn); }
.handCard { background: var(--surface); border: 1px solid var(--lineAccent); border-radius: 11px;
            padding: 11px 12px; display: flex; flex-direction: column; gap: 9px; }
.handCard .hrow { background: none; border: 0; padding: 0; }
.handBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.handBtns.five { grid-template-columns: repeat(5, 1fr); }
.handBtns.four { grid-template-columns: repeat(4, 1fr); }
.handBtns.five .rowBtn, .handBtns.four .rowBtn { font-size: 13px; padding: 0 2px; }
.handCard.done { border-color: var(--line); opacity: .72; }
.handLine { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 2px 0 6px; }
.handLine .num { font-family: var(--mono); font-weight: 600; }
.pchips.gain { color: var(--gain); } .pchips.loss { color: var(--loss); }
.handBtns .rowBtn { width: 100%; height: 44px; padding: 0 6px; }
.pills { flex-wrap: wrap; }

.undoCard { background: var(--surfaceHigh); border: 1px solid var(--lineAccent); border-radius: 13px;
            padding: 14px 15px; display: flex; align-items: center; gap: 12px; }
.undoCard .txt { flex: 1; min-width: 0; }
.undoCard .txt .t { font-weight: 600; font-size: 15px; line-height: 1.25; text-wrap: pretty; }
.undoCard .txt .s { font-size: 12.5px; line-height: 1.3; color: var(--warn); margin-top: 2px; }
.undoBtn { height: 52px; padding: 0 17px; border-radius: 10px; background: transparent;
           border-color: var(--warn); color: var(--warn); font-size: 15px; flex: none; }

.log { display: flex; flex-direction: column; }
.entry { display: flex; align-items: center; gap: 12px; padding: 13px 4px;
         border-bottom: 1px solid var(--surfaceHigh); }
.entry:last-child { border-bottom: 0; }
.entry .when { font-family: var(--mono); font-weight: 500; font-size: 12px; line-height: 1;
               color: var(--text2); width: 42px; flex: none; }
.entry .what { flex: 1; min-width: 0; font-weight: 500; font-size: 14.5px; line-height: 1.35;
               text-wrap: pretty; }
.entry .d { font-family: var(--mono); font-weight: 600; font-size: 15px; line-height: 1;
            font-variant-numeric: tabular-nums; flex: none; }
.entry .d.up { color: var(--gain); }
.entry .d.down { color: var(--loss); }
.entry .d.none { font-family: var(--sans); font-weight: 500; font-size: 13px; color: var(--text2); }

/* ---------------------------------------------------------------- join + menu */
.hero { flex: 1; min-height: 0; display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 18px; padding: 0 26px; }
.brandName { font-weight: 700; font-size: 34px; line-height: 1.1; letter-spacing: -.02em;
             text-align: center; }
.tagline { margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: var(--text2);
           text-align: center; text-wrap: pretty; }
.field { width: 100%; height: 60px; background: var(--surface); border: 1px solid var(--line);
         border-radius: 12px; color: var(--text); font-family: var(--sans); font-size: 17px;
         padding: 0 16px; }
.field:focus { outline: none; border-color: var(--accent); }

.pills { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--line);
         border-radius: 9px; padding: 3px; }
.pills > button { height: 38px; padding: 0 13px; border: none; border-radius: 7px;
                  background: transparent; color: var(--text2); font-size: 13px; }
.pills > button.on { background: var(--accent); color: var(--onAccent); }

.menu { position: absolute; inset: 0; background: rgba(20,17,14,.72); display: flex;
        flex-direction: column; align-items: stretch; padding: 64px var(--side) 0; z-index: 5; }
.menuCard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
            padding: 8px; display: flex; flex-direction: column; gap: 4px;
            max-width: 520px; width: 100%; margin: 0 auto; }
.menuCard > button { height: 52px; background: transparent; border: none; text-align: start;
                     font-size: 16px; }
.menuCard .langRow { display: flex; align-items: center; justify-content: space-between;
                     padding: 6px 12px 8px; }
.menuCard .langRow .cap { padding-inline-end: 10px; }

/*
  Very short viewport: the shortcuts go, not the keypad. They are an
  accelerator by definition and typing the amount is the promise, so this is
  the one thing on the screen that can be dropped without breaking it.
*/
@media (max-height: 580px) {
  .quickBlock { display: none; }
  #v-amount .scroll { gap: 8px; }
}

/* Smaller still: the running balance goes too, so the keys keep their size. */
@media (max-height: 520px) {
  .rest { display: none; }
  .amountNum { --figure: 38px; }
  .caret { height: 30px; }
}

/*
  Short viewport: the figure gives up size before it gives up being on screen,
  and the "+25" row goes before the pot-relative one — those three are the ones
  that would need mental arithmetic to type.
*/
@media (max-height: 720px) {
  .quick.add { display: none; }
  .amountCard { padding: 12px 16px; }
  .amountNum { --figure: 44px; }
  .caret { height: 36px; }
  .quick { height: 48px; }
  .rest { margin-top: 8px; padding-top: 8px; }
}

#err { color: var(--loss); font-size: 13px; line-height: 1.35; min-height: 1.2em;
       text-wrap: pretty; }
</style>
</head>
<body>

<!--
  The web client the host phone serves. Guests install nothing: this page and a
  WebSocket back to the same address are the whole client.

  One file, no framework, no build step, and not one byte fetched from outside
  the phone in front of you — the fonts are embedded above. The hotspot has no
  internet and never will.
-->

<section class="view" id="v-join">
  <div class="head"><span class="headTitle" id="joinRoom"></span></div>
  <div class="hero">
    <div class="mark s72"><i></i></div>
    <div>
      <div class="brandName">TableChips</div>
      <p class="tagline" data-i18n="home.tagline"></p>
    </div>
    <input class="field" type="text" id="name" maxlength="24" autocomplete="nickname"
           enterkeyhint="go" data-i18n-placeholder="join.name">
    <div class="pills" id="joinLangs"></div>
  </div>
  <div class="actions">
    <p id="err"></p>
    <button class="primary" id="joinBtn" data-i18n="join.action"></button>
  </div>
</section>

<section class="view" id="v-table">
  <div class="head">
    <div class="mark s18"><i></i></div>
    <span class="headTitle" id="tableName"></span>
    <span style="flex:1"></span>
    <span class="role" id="tableRole" hidden data-i18n="host.role"></span>
    <button class="dots help" id="rulesBtn" aria-label="rules">?</button>
    <button class="dots" id="menuBtn" aria-label="menu"><i></i><i></i><i></i></button>
  </div>
  <div class="scroll">
    <div class="note" id="offline" hidden>
      <div class="bang">!</div>
      <div class="txt" data-i18n="net.offline"></div>
    </div>

    <div class="card stackCard" id="myCard">
      <div class="stackTop">
        <span class="cap" data-i18n="player.stack"></span>
        <span class="num" id="myNet" style="font-weight:600;font-size:13px"></span>
      </div>
      <div class="stackNum" id="myStack">0</div>
      <div class="chipRow" id="myChips"></div>
    </div>

    <div class="metrics" id="pots"></div>
    <div class="hostHand" id="hostHand" hidden></div>
    <div class="rows" id="bankHands" hidden></div>

    <div class="undoCard" id="undoBar" hidden>
      <div class="txt">
        <div class="t" id="undoBarWhat"></div>
        <div class="s" data-i18n="undo.window"></div>
      </div>
      <button class="undoBtn" data-i18n="log.undo" id="undoBarBtn"></button>
    </div>

    <div class="rows" id="tableRows"></div>
    <p id="err2" style="color:var(--loss);font-size:13px;line-height:1.35;text-wrap:pretty"></p>
  </div>
  <div class="actions" id="tableActions"></div>
</section>

<section class="view" id="v-amount">
  <div class="head">
    <button class="iconBtn" id="amountBack" aria-label="back"><span class="back"></span></button>
    <div class="headStack">
      <div class="t" id="amountTitle"></div>
      <div class="s" id="amountSub"></div>
    </div>
  </div>
  <div class="scroll pane">
    <div class="card amountCard">
      <div class="cap" data-i18n="amount.label"></div>
      <div class="amountRow"><span class="amountNum" id="amountValue">0</span><span class="caret"></span></div>
      <div class="rest">
        <span class="l" id="restLabel"></span>
        <span class="v" id="restValue"></span>
      </div>
    </div>
    <div class="pills amountMode" id="amountMode"></div>
    <div class="quickBlock" id="quickBlock">
      <div class="cap" style="margin-bottom:9px" data-i18n="amount.quick"></div>
      <div class="grid3" id="quick"></div>
    </div>
    <div class="grid3 pad" id="keypad"></div>
    <div class="chipPad" id="chipPad" hidden></div>
  </div>
  <div class="actions">
    <div class="row">
      <button class="secondary" style="flex:none;width:112px;height:64px" id="amountCancel"
              data-i18n="common.cancel"></button>
      <button class="primary" style="flex:1" id="amountOk">
        <span id="amountOkLabel"></span><span class="n" id="amountOkValue"></span>
      </button>
    </div>
  </div>
</section>

<section class="view" id="v-host">
  <div class="head">
    <button class="iconBtn" id="hostBack" aria-label="back"><span class="back"></span></button>
    <div class="headStack">
      <div class="t" data-i18n="hostPanel.title"></div>
      <div class="s" id="hostSub"></div>
    </div>
  </div>
  <div class="scroll">
    <div class="card award">
      <div class="awardTop">
        <span class="cap" id="awardCap" data-i18n="hostPanel.awardPot"></span>
        <span class="v num" id="awardPot">0</span>
      </div>
      <div class="pills" id="awardPots" style="margin-top:11px" hidden></div>
      <div class="s" id="tieHint" style="margin-top:13px;color:var(--text2)" hidden
           data-i18n="hostPanel.tieHint"></div>
      <div class="rows" id="awardRows" style="margin-top:13px"></div>
      <div class="row" id="awardTools" style="display:flex;gap:7px;margin-top:7px">
        <button class="secondary" style="height:52px;font-size:14px" id="splitBtn"
                data-i18n="hostPanel.split"></button>
        <button class="secondary" style="height:52px;font-size:14px" id="tieBtn"
                data-i18n="hostPanel.tie"></button>
        <button class="secondary" style="height:52px;font-size:14px" id="newPotBtn"
                data-i18n="hostPanel.newPot"></button>
      </div>
      <div class="row" id="tieTools" style="display:flex;gap:7px;margin-top:7px" hidden>
        <button class="secondary" style="height:52px;font-size:14px" id="tieCancel"
                data-i18n="common.cancel"></button>
        <button class="secondary" style="height:52px;font-size:14px" id="tieOk"></button>
      </div>
    </div>
    <div class="rows" id="pokerBlock" hidden>
      <div class="cap" data-i18n="mode.poker"></div>
      <div class="rows" id="pokerRows"></div>
    </div>
    <div class="rows">
      <div class="cap" data-i18n="hostPanel.players"></div>
      <div class="rows" id="hostRows"></div>
    </div>
    <div class="rows" id="handsBlock" hidden>
      <div class="cap" data-i18n="bank.title"></div>
      <div class="rows" id="handRows"></div>
    </div>
    <div class="rows">
      <div class="cap" id="seatsCap" data-i18n="seats.title"></div>
      <div class="rows" id="seatRows"></div>
    </div>
    <div class="rows">
      <div class="cap" data-i18n="game.title"></div>
      <div class="pills" id="modePills"></div>
      <div class="rows" id="gameSettings"></div>
    </div>
    <div class="rows">
      <div class="cap" data-i18n="hostPanel.buyIn"></div>
      <button class="secondary" style="height:52px;font-size:15px" id="buyInBtn"></button>
    </div>
  </div>
  <div class="actions">
    <div class="row">
      <button class="secondary" id="hostLogBtn" data-i18n="log.short"></button>
      <button class="secondary" id="hostDoneBtn" data-i18n="log.back"></button>
    </div>
  </div>
</section>

<section class="view" id="v-log">
  <div class="head">
    <button class="iconBtn" id="logBack" aria-label="back"><span class="back"></span></button>
    <div class="headStack">
      <div class="t" data-i18n="log.title"></div>
      <div class="s" id="logSub"></div>
    </div>
  </div>
  <div class="scroll" style="gap:8px">
    <div class="undoCard" id="logUndo" hidden>
      <div class="txt">
        <div class="t" id="logUndoWhat"></div>
        <div class="s" data-i18n="undo.always"></div>
      </div>
      <button class="undoBtn" id="logUndoBtn" data-i18n="log.undo"></button>
    </div>
    <div class="log" id="logRows"></div>
  </div>
  <div class="actions">
    <button class="secondary" style="width:100%" id="logDone" data-i18n="log.back"></button>
  </div>
</section>

<section class="view" id="v-rules">
  <div class="head">
    <button class="iconBtn" id="rulesBack" aria-label="back"><span class="back"></span></button>
    <div class="headStack">
      <div class="t" data-i18n="rules.title"></div>
      <div class="s" id="rulesSub"></div>
    </div>
  </div>
  <div class="scroll" style="gap:8px">
    <div class="cap" data-i18n="rules.play"></div>
    <div class="ruleCard" id="rulesPlay"></div>
    <div class="rows" id="rulesHands" hidden></div>
    <div class="cap" data-i18n="rules.count"></div>
    <div class="ruleCard" id="rulesCount"></div>
    <div class="cap" data-i18n="rules.people"></div>
    <div class="ruleCard strong" id="rulesPeople"></div>
    <div class="cap" data-i18n="rules.table"></div>
    <div class="ruleCard values" id="rulesValues"></div>
  </div>
  <div class="actions">
    <button class="secondary" style="width:100%" id="rulesDone" data-i18n="log.back"></button>
  </div>
</section>

<section class="view" id="v-name">
  <div class="head">
    <button class="iconBtn" id="nameBack" aria-label="back"><span class="back"></span></button>
    <div class="headStack">
      <div class="t" data-i18n="name.title"></div>
      <div class="s" data-i18n="name.sub"></div>
    </div>
  </div>
  <div class="scroll">
    <input class="field" type="text" id="renameField" maxlength="24" autocomplete="nickname"
           enterkeyhint="done" data-i18n-placeholder="join.name">
  </div>
  <div class="actions">
    <button class="primary" id="renameSave" data-i18n="common.save"></button>
  </div>
</section>

<div class="menu" id="menu" hidden>
  <div class="menuCard">
    <button id="mHost" data-i18n="hostPanel.title"></button>
    <button id="mLog" data-i18n="log.title"></button>
    <button id="mRename" data-i18n="menu.rename"></button>
    <button id="mStand" data-i18n="action.stand"></button>

    "rules.manual.play": "La mesa no sabe a qué juego jugáis: solo cuenta fichas. Sirve para cualquier juego con apuesta —julepe, truc, mus, monte— y para todos los que no tienen modo propio.",
    "rules.manual.count": "Cada uno apuesta al bote desde su móvil. El anfitrión da el bote a quien lo ha ganado, entero o a partes, y puede abrir botes nuevos. Un bote que nadie se lleva se queda en la mesa para la mano siguiente.",
    "rules.manual.people": "Las reglas, los turnos y quién gana cada mano. La app solo apunta lo que dice el anfitrión, y todo se puede deshacer desde el registro.",
    "rules.seven_half.play": "Se juega con baraja española de 40 cartas. Las cartas de número valen su número y las figuras (sota, caballo y rey), medio punto. Cada uno pide cartas para acercarse a siete y media sin pasarse, y juega solo contra la banca.",
    "rules.seven_half.count": "Quien tiene la banca la lleva con sus fichas, y los demás apuestan contra ella antes de repartir. Cuando acaba la mano, la banca (o el anfitrión) resuelve cada apuesta desde la mesa: gana (la banca paga lo mismo), pierde (la apuesta es para la banca), empate (vuelve la apuesta) o siete y media (la banca paga lo que marca esta mesa). Si la banca se pasa, «Paga a todos» resuelve de una vez a todos los que quedan. Si la banca no puede pagar, tiene que añadir fichas. Quien quiera la banca la coge mientras está libre.",
    "rules.seven_half.people": "Quién tiene la banca y cuándo pasa, qué jugada cuenta como siete y media, y quién se lleva el empate: en muchos sitios, la banca, y entonces hay que pulsar «Pierde». La banca decide libremente si pide carta o se planta, según lo que ve en los demás.",
    "rules.blackjack.play": "Cada uno intenta acercarse a 21 sin pasarse. Las figuras valen 10, el as 1 u 11, y el resto su número. Un as y una carta de 10 como primeras cartas es blackjack. Todos juegan contra la casa.",
    "rules.blackjack.count": "La banca es la casa: tiene fichas propias, no ocupa ningún puesto y no apuesta; quien reparte la lleva. Los jugadores apuestan antes de repartir y pueden doblar o separar con un toque; cada mano separada se resuelve por separado. Cuando acaba la mano, quien reparte (o el anfitrión) resuelve cada mano desde la mesa: gana, pierde, empate, blackjack (la casa paga lo que marca esta mesa) o se rinde (vuelve la mitad de la apuesta).",
    "rules.blackjack.people": "La casa no decide nada: pide carta con 16 o menos y se planta con 17 o más. Quién ha ganado cada mano, y las demás normas de la casa, las ponéis vosotros.",
    "rules.poker.play": "Texas hold'em: cada uno recibe dos cartas y hay cinco comunes, que salen en tres tandas. Hay una ronda de apuestas antes y después de cada tanda, y gana la mejor jugada de cinco cartas.",
    "rules.poker.count": "«Mano nueva» mueve el repartidor y pone las ciegas. El botón grande dice exactamente cuánto cuesta igualar. Entre tandas, el anfitrión cierra la ronda. Si alguien va all-in con menos fichas, «Dividir el bote» separa los botes que puede ganar cada uno, y el anfitrión los da uno a uno. Cuando se ha dado todo el bote, la mano siguiente empieza sola. Si todos se retiran menos uno, el bote es suyo sin que nadie tenga que hacer nada. En un empate, «Empate» reparte el bote a partes iguales.",
    "rules.poker.people": "De quién es el turno, cuándo se puede pasar y quién gana la mano. La app cuenta las fichas; el juego lo lleváis vosotros.",

    "rules.noBlinds": "No blinds",
    "rules.manual.play": "The table does not know which game you are playing: it only counts chips. It works for any game with betting — canari, truc, mus, monte — and for every game without a mode of its own.",
    "rules.manual.count": "Everyone bets into the pot from their own phone. The host gives the pot to whoever won it, whole or in parts, and can open more pots. A pot nobody takes stays on the table for the next hand.",
    "rules.manual.people": "The rules, the turns and who wins each hand. The app only writes down what the host says, and anything can be undone from the log.",
    "rules.seven_half.play": "Played with a 40-card Spanish deck. Number cards are worth their number and the face cards (sota, caballo, rey) half a point. Each player draws to get as close to seven and a half as possible without going over, playing alone against the bank.",
    "rules.seven_half.count": "Whoever holds the bank banks it with their own chips, and the others stake against it before the deal. When the hand is over, the bank (or the host) settles each stake from the table: wins (the bank pays the same again), loses (the stake goes to the bank), push (the stake comes back) or seven and a half (the bank pays what this table says). If the bank busts, Pay everyone settles everybody left at once. If the bank cannot pay, it has to add chips. Anybody may take the bank while nobody holds it.",
    "rules.seven_half.people": "Who holds the bank and when it passes on, which hand counts as a seven and a half, and who takes a tie: in many places the bank does, and then the button to press is Loses. The bank is free to draw or stand, going by what it sees of the others.",
    "rules.blackjack.play": "Each player tries to get as close to 21 as possible without going over. Face cards are worth 10, an ace 1 or 11, the rest their number. An ace and a ten-card as the first two cards is a blackjack. Everyone plays against the house.",
    "rules.blackjack.count": "The bank is the house: it has chips of its own, takes no seat and does not bet; whoever deals runs it. Players stake before the deal and can double or split in one tap; each split hand is settled on its own. When the hand is over, the dealer (or the host) settles each hand from the table: wins, loses, push, blackjack (the house pays what this table says) or surrenders (half the stake back).",
    "rules.blackjack.people": "The house decides nothing: it draws on 16 or less and stands on 17 or more. Who won each hand, and the other house rules, are yours to settle.",
    "rules.poker.play": "Texas hold'em: each player gets two cards and five are shared, dealt in three rounds. There is a round of betting before and after each, and the best five-card hand wins.",
    "rules.poker.count": "New hand moves the dealer and posts the blinds. The big button says exactly what a call costs. Between rounds, the host closes the round. If somebody goes all-in with fewer chips, Split the pot separates the pots each player can win, and the host awards them one by one. Once the last of the pot is awarded, the next hand deals itself. If everybody but one folds, the pot is theirs without anybody doing a thing. On a tie, Tie shares the pot evenly.",
    "rules.poker.people": "Whose turn it is, when you may check, and who wins the hand. The app counts the chips; the game is yours.",
