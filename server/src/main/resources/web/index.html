const LANGS = ["ca", "es", "en"];
let lang = pickLanguage();
let mode = "manual";

function pickLanguage() {
  const stored = store.get("lang");
  if (stored && DICT[stored]) return stored;
  for (const tag of (navigator.languages || [navigator.language || "ca"])) {
    const base = String(tag).toLowerCase().split("-")[0];
    if (DICT[base]) return base;
  }
  return "ca";
}

function lookUp(dictionary, key) {
  if (!dictionary) return undefined;
  const perMode = dictionary.modes && dictionary.modes[mode];
  if (perMode && perMode[key] !== undefined) return perMode[key];
  return dictionary[key];
}

/** %s takes positional arguments; %{name} takes the log entry's own arguments. */
function t(key, ...args) {
  let text = lookUp(DICT[lang], key);
  if (text === undefined) text = lookUp(DICT.en, key);
  if (text === undefined) return key;
  if (args.length && typeof args[0] === "object" && args[0] !== null) {
    for (const [name, value] of Object.entries(args[0])) {
      text = text.split("%{" + name + "}").join(value);
    }
    return text;
  }
  for (const value of args) text = text.replace("%s", value);
  return text;
}

/** Picks the plural form the reader's language actually uses. */
function pluralKey(key, count) {
  const withForm = key + "." + new Intl.PluralRules(lang).select(count);
  return lookUp(DICT[lang], withForm) === undefined ? key + ".other" : withForm;
}

/**
 * Chips are whole numbers and the thousands separator is a narrow no-break
 * space in all three languages, so "1 250" has the same width everywhere and
 * never breaks across lines. The minus is U+2212, not a hyphen.
 */
function fmt(value) {
  const n = Math.round(Number(value) || 0);
  const digits = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (n < 0 ? "−" : "") + digits;
}

/**
 * Sets a figure and shrinks it to fit. Chips have no ceiling — somebody will
 * buy in for a hundred million because they can — and the layout has to hold.
 */
function figure(node, text) {
  node.textContent = text;
  const length = text.length;
  const fit = length <= 7 ? 1
    : length <= 9 ? 0.78
    : length <= 11 ? 0.62
    : length <= 13 ? 0.5
    : 0.42;
  node.style.setProperty("--fit", fit);
}

function signed(value) {
  const n = Math.round(Number(value) || 0);
  return (n > 0 ? "+" : "") + fmt(n);
}

function applyLanguage() {
  document.documentElement.lang = lang;
  for (const node of document.querySelectorAll("[data-i18n]")) {
    node.textContent = t(node.dataset.i18n);
  }
  for (const node of document.querySelectorAll("[data-i18n-placeholder]")) {
    node.placeholder = t(node.dataset.i18nPlaceholder);
    node.setAttribute("aria-label", node.placeholder);
  }
  for (const group of [document.getElementById("joinLangs"), document.getElementById("menuLangs")]) {
    group.replaceChildren(...LANGS.map((code) => {
      const button = document.createElement("button");
      button.textContent = code.toUpperCase();
      if (code === lang) button.className = "on";
      button.onclick = () => { lang = code; store.set("lang", code); applyLanguage(); };
      return button;
    }));
  }
  render();
}

// ---------------------------------------------------------------- protocol
const V = 1;
let socket = null;
let state = null;
let me = null;
let undoDepth = 0;
let online = false;
let closedByHost = false;
let lastRev = 0;
let undoBar = null;      // the last move, offered on the table screen for a while
let undoBarTimer = null;

function roomFromUrl() {
  return new URLSearchParams(location.search).get("room");
}

function connect() {
  if (closedByHost) return;
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  socket = new WebSocket(scheme + "//" + location.host + "/ws");
  socket.onopen = () => {
    online = true;
    reconnectDelay = 500;
    const name = store.get("name");
    if (name) join(name);
    render();
  };
  socket.onclose = () => { online = false; render(); scheduleReconnect(); };
  socket.onerror = () => { online = false; render(); };
  socket.onmessage = (event) => receive(JSON.parse(event.data));
}

function receive(message) {
  if (message.type === "state") {
    const previous = state;
    state = message.state;
    me = message.you;
    undoDepth = message.undoDepth;
    mode = (state.config && state.config.mode) || "manual";
    store.set("playerId", me);
    showError("");
    if (previous && state.rev > lastRev && state.log.length) noteUndoable(state.log[state.log.length - 1]);
    lastRev = state.rev;
    if (view === "join" && player(me)) showView("table");
    render();
  } else if (message.type === "error") {
    showError(t("error." + message.code));
  } else if (message.type === "kicked") {
    // Nothing to reconnect to: rejoining would just be thrown out again.
    closedByHost = true;
    store.remove("playerId");
    // The reason decides what the screen says: thrown out, seat handed to
    // somebody else, or the whole table closed. Silence would look like a
    // network drop, which is the one thing it is not.
    showError(t("error." + (message.reason || "kicked")));
  }
}

/**
 * The bar on the table screen is a convenience with a short life; the log
 * offers undo of any depth, for ever, which is the promise of the product.
 * A single timeout, no ticking clock: the host's battery has to last the night.
 */
function noteUndoable(entry) {
  undoBar = entry;
  clearTimeout(undoBarTimer);
  undoBarTimer = setTimeout(() => { undoBar = null; render(); }, 30000);
}

let reconnectDelay = 500;
function scheduleReconnect() {
  setTimeout(() => {
    reconnectDelay = Math.min(reconnectDelay * 2, 5000);
    connect();
  }, reconnectDelay);
}

function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(Object.assign({ v: V }, message)));
    buzz();
  }
}

function join(name) {
  store.set("name", name);
  send({ type: "join", name: name, playerId: store.get("playerId"), room: roomFromUrl() });
}

const act = (action) => send({ type: "action", action: action });
const hostCommand = (command) => send({ type: "hostCommand", command: command });

/** The main signal at a noisy table. Absent on iOS, which is why it is never alone. */
function buzz() {
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
}

// ---------------------------------------------------------------- state helpers
function player(id) { return state && state.players.find((p) => p.id === id); }
function mine() { return me ? player(me) : undefined; }
function iAmHost() { const p = mine(); return !!p && p.isHost; }
function seated() { const p = mine(); return !!p && p.seat !== null; }
function seatedPlayers() {
  return state ? state.players.filter((p) => p.seat !== null).sort((a, b) => a.seat - b.seat) : [];
}
function potName(pot) {
  if (pot.name) return pot.name;
  if (pot.id === "main") return t("pot.main");
  if (mode === "poker") return t("poker.sidePot", fmt(Number(pot.id.split("-")[1] || 1)));
  return pot.id;
}
function bankGame() { return mode === "seven_half" || mode === "blackjack"; }
function banker() { return state && state.banker ? player(state.banker) : undefined; }
function iAmBanker() { return !!me && !!state && state.banker === me; }
function toCall(who) {
  if (!state || !who) return 0;
  return Math.max(0, (state.currentBet || 0) - (who.roundBet || 0));
}
/** Who may be given this pot: everybody, or only those still in the hand. */
function eligibleFor(pot) {
  const seats = seatedPlayers();
  if (!pot.eligible) return mode === "poker" ? seats.filter((p) => !p.folded) : seats;
  return pot.eligible.map((id) => player(id)).filter(Boolean);
}
function potTotal() { return state ? state.pots.reduce((sum, pot) => sum + pot.amount, 0) : 0; }
/**
 * The pot the screens act on: the one picked, until it has been given away;
 * then the next one that still holds chips, so a host handing out side pots
 * never has to go and find the next one.
 */
function currentPot() {
  if (!state) return null;
  return state.pots.find((p) => p.id === selectedPot && p.amount > 0)
    || state.pots.find((p) => p.amount > 0)
    || state.pots.find((p) => p.id === selectedPot) || state.pots[0];
}
let selectedPot = "main";

// ---------------------------------------------------------------- views
let view = "join";
const VIEWS = ["join", "table", "amount", "host", "log", "rules", "name"];

function showView(next) {
  view = next;
  for (const name of VIEWS) document.getElementById("v-" + name).classList.toggle("on", name === next);
  document.getElementById("menu").hidden = true;
  render();
}

function showError(text) {
  for (const id of ["err", "err2"]) document.getElementById(id).textContent = text;
  if (!text) return;
  clearTimeout(showError.timer);
  showError.timer = setTimeout(() => {
    for (const id of ["err", "err2"]) document.getElementById(id).textContent = "";
  }, 6000);
}

/** Marks a value that has to be set in Plex Mono, like every number here. */
function num(value) { return { n: value }; }

/**
 * Fills a node from a translated string, dropping each value in its place.
 * Numbers go in their own mono span instead of being pasted into the string:
 * at 12 px the narrow no-break space of a thousands separator all but vanishes
 * in the sans face, and "1 000" has to keep looking like a thousand.
 */
function fill(node, key, ...values) {
  const parts = t(key).split("%s");
  const out = [];
  parts.forEach((part, index) => {
    if (part) out.push(part);
    const value = values[index];
    if (value === undefined) return;
    out.push(value && value.n !== undefined ? el("span", "num", value.n) : String(value));
  });
  node.replaceChildren(...out);
}

/** The same, for the log templates, whose placeholders are named. */
const MONO_ARGS = new Set(["amount", "buyIn", "seat", "room"]);

function fillEntry(node, entry) {
  const who = entry.actorName || (entry.actor && player(entry.actor) || {}).name;
  const args = logArgs(entry.args);
  const out = [];
  if (who) out.push(who + " ");
  for (const part of t(entry.key).split(/(%\{[a-zA-Z]+\})/)) {
    const token = part.match(/^%\{([a-zA-Z]+)\}$/);
    if (!token) { if (part) out.push(part); continue; }
    const value = args[token[1]] === undefined ? part : args[token[1]];
    out.push(MONO_ARGS.has(token[1]) ? el("span", "num", value) : String(value));
  }
  node.replaceChildren(...out);
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function render() {
  if (view === "amount") { renderAmount(); return; }
  if (!state) return;
  if (view === "table") renderTable();
  if (view === "host") renderHost();
  if (view === "log") renderLog();
  if (view === "rules") renderRules();
  document.getElementById("mHost").hidden = !iAmHost();
  document.getElementById("mStand").hidden = !seated();
}

// ---------------------------------------------------------------- table
function renderTable() {
  document.getElementById("tableName").textContent = t("join.table", state.roomCode);
  document.getElementById("tableRole").hidden = !iAmHost();
  document.getElementById("offline").hidden = online;

  const player = mine();
  document.getElementById("myCard").hidden = !seated();
  if (player) {
    figure(document.getElementById("myStack"), fmt(player.stack));
    renderChips(document.getElementById("myChips"), player.stack);
    const net = player.stack - player.boughtIn;
    const netNode = document.getElementById("myNet");
    netNode.textContent = net === 0 ? "" : signed(net);
    netNode.style.color = net >= 0 ? "var(--gain)" : "var(--loss)";
  }

  renderPots();
  renderHostHand();
  renderBankHands();
  renderUndoBar();
  renderSeats();
  renderTableActions();
}

/**
 * What the host does between the players' moves, where the host already is:
 * closing a street, saying who won, dealing when no hand is on. Each shows
 * only when it would do something.
 */
function renderHostHand() {
  const bar = document.getElementById("hostHand");
  const nodes = [];
  if (mode === "poker" && iAmHost()) {
    const bets = state.players.some((p) => (p.roundBet || 0) > 0);
    const canDeal = state.players.filter((p) => p.seat !== null && p.stack > 0).length >= 2;
    const button = (key, onClick) => { const b = el("button", "secondary", t(key)); b.onclick = onClick; return b; };
    if (bets) nodes.push(button("poker.closeRound", () => hostCommand({ type: "close_round" })));
    if (potTotal() > 0) nodes.push(button("poker.award", () => { pendingSplit = null; showView("host"); }));
    else if (canDeal) nodes.push(button("poker.newHand", () => hostCommand({ type: "start_hand" })));
  }
  bar.replaceChildren(...nodes);
  bar.hidden = nodes.length === 0;
}

function renderPots() {
  if (bankGame()) { renderBankMetrics(); return; }
  const pots = state.pots;
  const cards = pots.map((pot) => {
    const node = el(pots.length > 1 ? "button" : "div", "card metric");
    node.append(el("div", "cap", pots.length > 1 ? potName(pot) : t("pot")));
    const value = el("div", "v");
    figure(value, fmt(pot.amount));
    node.append(value);
    if (pots.length > 1) {
      if (pot.id === currentPot().id) node.classList.add("sel");
      node.onclick = () => { selectedPot = pot.id; render(); };
    }
    return node;
  });
  if (mode === "poker") {
    const owed = toCall(mine());
    if (seated() && owed > 0) {
      const card = el("div", "card metric");
      card.append(el("div", "cap", t("poker.toCall")));
      const value = el("div", "v");
      figure(value, fmt(owed));
      card.append(value);
      cards.push(card);
    }
  }
  document.getElementById("pots").replaceChildren(...cards);
}

/**
 * In a game with a bank there is no pot: what matters is what you have up for
 * this hand, and who you are playing it against.
 */
function renderBankMetrics() {
  const cards = [];
  const who = mine();
  // A bank game has no pot, but chips left in one from another game are still
  // chips: never hide them.
  if (potTotal() > 0) {
    const pot = el("div", "card metric");
    pot.append(el("div", "cap", t("pot")));
    const amount = el("div", "v");
    figure(amount, fmt(potTotal()));
    pot.append(amount);
    cards.push(pot);
  }
  if (who && who.seat !== null && !iAmBanker()) {
    const stake = el("div", "card metric" + (who.stake > 0 ? " sel" : ""));
    stake.append(el("div", "cap", t("bank.yourStake")));
    const value = el("div", "v");
    figure(value, fmt(who.stake || 0));
    stake.append(value);
    cards.push(stake);
  }
  // What the bank pays from: the house's chips at blackjack, the banker's
  // stack at set i mig. The one number everybody at the table watches.
  const bank = el("div", "card metric");
  const held = banker();
  const value = el("div", "v");
  if (mode === "blackjack") {
    bank.append(el("div", "cap", t("bank.house")));
    figure(value, fmt(state.house || 0));
  } else if (held) {
    bank.append(el("div", "cap", t("bank.holder", held.name)));
    figure(value, fmt(held.stack));
  } else {
    bank.append(el("div", "cap", t("bank.title")));
    value.style.fontSize = "15px";
    value.textContent = t("bank.none");
  }
  bank.append(value);
  cards.push(bank);
  document.getElementById("pots").replaceChildren(...cards);
}

function renderUndoBar() {
  const bar = document.getElementById("undoBar");
  const show = iAmHost() && undoBar && undoDepth > 0;
  bar.hidden = !show;
  if (show) fillEntry(document.getElementById("undoBarWhat"), undoBar);
}

function renderSeats() {
  const rows = [];
  const iAmSeated = seated();
  let free = 0;
  for (let seat = 0; seat < state.config.seatCount; seat++) {
    const who = state.players.find((p) => p.seat === seat);
    if (who) rows.push(seatRow(seat, who));
    else if (iAmSeated) free++;
    else rows.push(freeRow(seat));
  }
  if (free > 0) {
    const row = el("div", "prow");
    const label = el("span", "free");
    fill(label, pluralKey("table.free_seats", free), num(fmt(free)));
    row.append(label);
    rows.push(row);
  }
  state.players.filter((p) => p.seat === null).forEach((p) => rows.push(watcherRow(p)));

  const head = el("div", "rowsCap");
  head.append(el("span", "cap", t("player.atTable")),
              el("span", "cap", mode === "poker" || bankGame() ? t("poker.betColumn") : fmt(seatedPlayers().length)));
  document.getElementById("tableRows").replaceChildren(head, ...rows);
}

function seatRow(seat, who) {
  const row = el("div", "prow" + (who.connected ? "" : " dim"));
  const dot = el("div", "dot" + (who.id === me ? " me" : (who.connected ? " on" : "")));
  const name = el("span", "pname" + (who.id === me ? " self" : ""), who.name);
  row.append(dot, name);
  if (who.isHost) row.append(el("span", "ptag", t("host.role")));
  if (bankGame() && state.banker === who.id) {
    row.append(el("span", "ptag", t(mode === "blackjack" ? "poker.button" : "bank.title")));
  }
  if (mode === "poker") {
    if (state.button === seat) row.append(el("span", "ptag", t("poker.button")));
    if (who.folded) row.append(el("span", "ptag", t("poker.foldedTag")));
    else if (who.stack === 0 && who.committed > 0) row.append(el("span", "ptag bad", t("poker.allIn")));
  }
  if (!who.connected) row.append(el("span", "ptag bad", t("player.gone")));
  // At a poker table what matters about the others is what they have pushed
  // forward this round, not what they have behind.
  if (mode === "poker") {
    const bet = who.roundBet || 0;
    row.append(el("span", "pchips" + (bet > 0 ? " bet" : " nobet"), bet > 0 ? fmt(bet) : "\u2014"));
    if (who.folded) row.classList.add("dim");
  } else if (bankGame()) {
    // Against the bank, what matters is the chips each player has up, and
    // once settled, what the hand came to: as in front of them on the felt.
    const settled = (who.settled || []).reduce((sum, hand) => sum + hand.delta, 0);
    if (who.id === state.banker) {
      row.append(el("span", "pchips nobet", "\u2014"));
    } else if (who.stake > 0) {
      row.append(el("span", "pchips bet", (who.hands && who.hands.length > 1 ? who.hands : [who.stake]).map(fmt).join(" + ")));
    } else if ((who.settled || []).length) {
      row.append(el("span", "pchips " + (settled > 0 ? "gain" : settled < 0 ? "loss" : "nobet"), settled === 0 ? "\u00b10" : signed(settled)));
    } else {
      row.append(el("span", "pchips nobet", "\u2014"));
    }
  } else {
    row.append(el("span", "pchips", fmt(who.stack)));
  }
  return row;
}

function freeRow(seat) {
  const row = el("div", "prow");
  row.append(el("div", "dot"));
  if (mine()) {
    const button = el("button", "pname", t("table.free"));
    button.style.cssText = "background:none;border:0;padding:0;text-align:start;color:var(--text2);font-weight:500";
    button.onclick = () => askBuyIn(seat);
    row.append(button);
  } else {
    row.append(el("span", "free", t("table.free")));
  }
  row.append(el("span", "pchips", ""));
  return row;
}

function watcherRow(who) {
  const row = el("div", "prow" + (who.connected ? "" : " dim"));
  row.append(el("div", "dot" + (who.id === me ? " me" : "")));
  row.append(el("span", "pname" + (who.id === me ? " self" : ""), who.name));
  if (who.isHost) row.append(el("span", "ptag", t("host.role")));
  row.append(el("span", "ptag", t("player.watching")));
  return row;
}

function renderTableActions() {
  const bar = document.getElementById("tableActions");
  const nodes = [];
  if (!seated()) {
    // One tap sits down with what the table deals, or back down with the chips
    // kept; any other amount is the exception, one tap further.
    const who = mine();
    const back = !!who && who.stack > 0;
    const sit = el("button", "primary");
    sit.append(el("span", null, t(back ? "sit.back" : "sit.confirm")),
               el("span", "n", fmt(back ? who.stack : state.config.defaultBuyIn)));
    sit.onclick = () => send({ type: "sit", seat: null, buyIn: back ? 0 : null });
    const nodes = [sit];
    if (!back) nodes.push(action(t("sit.other"), () => askBuyIn(null)));
    bar.replaceChildren(...nodes);
    return;
  }
  const who = mine();
  if (bankGame()) nodes.push(...bankActions(who));
  else if (mode === "poker") nodes.push(...pokerActions(who));
  else {
    const bet = el("button", "primary");
    bet.append(el("span", null, t("action.bet")));
    bet.onclick = () => openBet();
    nodes.push(bet);
  }
  // Standing up is in the menu: next to call and fold, one stray tap would
  // take a player out of the hand and off the table.
  nodes.push(action(t("action.rebuy"), () => openRebuy()));
  bar.replaceChildren(...nodes);
}

/**
 * The bank's side of the hand, on the table itself, for whoever holds the bank
 * and for the host: every stake still waiting with the ways it can end, the
 * hands already settled with how they ended, and the two outcomes that apply
 * to everybody at once. The app never sees the cards: this is somebody saying
 * what happened.
 */
let bankShort = null;
const OUTCOMES = [["win", "bank.win"], ["natural", "bank.natural"], ["push", "bank.push"],
                  ["lose", "bank.lose"], ["surrender", "bank.surrender"]];

function bankFunds() {
  if (mode === "blackjack") return state.house || 0;
  const held = banker();
  return held ? held.stack : 0;
}

function payout(outcome, stake) {
  const pays = state.config.naturalPays || { numerator: 3, denominator: 2 };
  return { win: stake, lose: -stake, push: 0, surrender: -(stake - Math.floor(stake / 2)),
           natural: Math.floor(stake * pays.numerator / pays.denominator) }[outcome];
}

function settleHand(who, outcome, hand) {
  const stake = hand === null ? who.stake : who.hands[hand];
  const need = payout(outcome, stake) - bankFunds();
  if (need > 0) { bankShort = need; render(); return; }
  bankShort = null;
  hostCommand({ type: "settle", player: who.id, outcome: outcome, hand: hand });
}

function settleAll(outcome) {
  const waiting = state.players.filter((p) => p.stake > 0 && p.id !== state.banker);
  const need = waiting.reduce((sum, p) => sum + payout(outcome, p.stake), 0) - bankFunds();
  if (need > 0) { bankShort = need; render(); return; }
  bankShort = null;
  hostCommand({ type: "settle_all", outcome: outcome });
}

function renderBankHands() {
  const block = document.getElementById("bankHands");
  const runs = bankGame() && (iAmHost() || iAmBanker()) && (mode === "blackjack" || !!state.banker);
  block.hidden = !runs;
  if (!runs) { block.replaceChildren(); return; }
  const nodes = [];
  const topUp = state.config.defaultBuyIn || 100;
  if (bankShort !== null) {
    const note = el("div", "note");
    note.append(el("span", "bang"), el("span", "txt", t("bank.short", fmt(bankShort))));
    nodes.push(note);
    if (mode === "blackjack") {
      const fund = el("button", "secondary", t("bank.fund", fmt(Math.max(topUp, bankShort))));
      fund.onclick = () => { hostCommand({ type: "fund_house", amount: Math.max(topUp, bankShort) }); bankShort = null; };
      nodes.push(fund);
    } else if (iAmBanker()) {
      const more = el("button", "secondary", t("bank.topUp", fmt(Math.max(topUp, bankShort))));
      more.onclick = () => { act({ type: "rebuy", amount: Math.max(topUp, bankShort) }); bankShort = null; };
      nodes.push(more);
    } else {
      const other = el("div", "s", t("bank.shortOther", banker() ? banker().name : ""));
      other.style.color = "var(--text2)";
      nodes.push(other);
    }
  } else if (mode === "blackjack" && (state.house || 0) === 0) {
    const fund = el("button", "secondary", t("bank.fund", fmt(topUp)));
    fund.onclick = () => hostCommand({ type: "fund_house", amount: topUp });
    nodes.push(fund);
  }

  const seatOrder = (a, b) => (a.seat === null ? 99 : a.seat) - (b.seat === null ? 99 : b.seat);
  const waiting = state.players.filter((p) => p.stake > 0 && p.id !== state.banker).sort(seatOrder);
  const done = state.players.filter((p) => p.stake === 0 && (p.settled || []).length && p.id !== state.banker).sort(seatOrder);
  if (waiting.length || done.length) nodes.push(el("div", "cap", t("bank.hands")));
  const outcomes = OUTCOMES.filter(([outcome]) => outcome !== "surrender" || mode === "blackjack");
  waiting.forEach((who) => {
    const card = el("div", "handCard");
    const hands = who.hands && who.hands.length ? who.hands : [who.stake];
    hands.forEach((amount, index) => {
      const line = el("div", "handLine");
      line.append(el("span", "n", index === 0 ? who.name : ""),
                  el("span", "num", (hands.length > 1 ? t("bank.hand", fmt(index + 1)) + " \u00b7 " : "") + fmt(amount)));
      card.append(line);
      const buttons = el("div", "handBtns " + (outcomes.length === 5 ? "five" : "four"));
      outcomes.forEach(([outcome, key]) => {
        const button = el("button", "rowBtn" + (outcome === "lose" || outcome === "surrender" ? " danger" : ""), t(key));
        button.onclick = () => settleHand(who, outcome, hands.length > 1 ? index : null);
        buttons.append(button);
      });
      card.append(buttons);
    });
    nodes.push(card);
  });
  // Settled hands stay where they were, with how they ended, until the player
  // stakes again: nothing slides under a finger about to tap.
  done.forEach((who) => {
    const card = el("div", "handCard done");
    const line = el("div", "handLine");
    const names = { win: "bank.win", lose: "bank.lose", push: "bank.push", natural: "bank.natural", surrender: "bank.surrender" };
    line.append(el("span", "n", who.name),
                el("span", "num", who.settled.map((hand) => t(names[hand.outcome]) + " " + (hand.delta === 0 ? "\u00b10" : signed(hand.delta))).join(" \u00b7 ")));
    card.append(line);
    nodes.push(card);
  });
  if (waiting.length >= 2) {
    const row = el("div", "row");
    const bust = el("button", "secondary", t("bank.bust"));
    bust.onclick = () => settleAll("win");
    const sweep = el("button", "secondary danger", t("bank.sweep"));
    sweep.onclick = () => settleAll("lose");
    [bust, sweep].forEach((b) => { b.style.cssText = "height:52px;font-size:14px"; });
    row.append(bust, sweep);
    nodes.push(row);
    const hint = el("div", "s", t("bank.restHint"));
    hint.style.cssText = "color:var(--text2);font-size:13px";
    nodes.push(hint);
  }
  block.replaceChildren(...nodes);
}

/** Stake against the bank, or hold it and wait for the others. */
function bankActions(who) {
  if (iAmBanker()) {
    const note = el("div", "note");
    note.append(el("span", "bang"), el("span", "txt", t(mode === "blackjack" ? "bank.dealing" : "bank.youSub")));
    return [note];
  }
  if (!state.banker) {
    // Nothing can be staked until somebody banks — or at blackjack, deals for
    // the house — and anybody seated may.
    const take = el("button", "primary");
    take.append(el("span", null, t(mode === "blackjack" ? "bank.deal" : "bank.take")));
    take.onclick = () => act({ type: "take_bank" });
    return [take];
  }
  const nodes = [];
  if (who.stake > 0) {
    if (mode === "blackjack") {
      // Doubling and splitting are the same chips again on a hand: one tap.
      const hands = who.hands && who.hands.length ? who.hands : [who.stake];
      const row = el("div", "row");
      if (hands.length === 1) {
        const double = action(t("bank.double"), () => act({ type: "double", hand: 0 }));
        const split = action(t("bank.split"), () => act({ type: "split", hand: 0 }));
        double.disabled = split.disabled = who.stack < hands[0];
        row.append(double, split);
      } else {
        hands.forEach((amount, index) => {
          const double = action(t("bank.doubleHand", fmt(index + 1)), () => act({ type: "double", hand: index }));
          double.disabled = who.stack < amount;
          row.append(double);
        });
      }
      nodes.push(row);
    } else {
      const more = el("button", "primary");
      more.append(el("span", null, t("bank.stake")));
      more.onclick = () => openStake();
      nodes.push(more);
    }
    const row = el("div", "row");
    row.append(action(t("bank.cancel"), () => act({ type: "cancel_stake" }), "want"));
    nodes.push(row);
    return nodes;
  }
  // Most hands are staked like the last one: that is one tap.
  const again = (who.lastStake || 0) > 0 && who.lastStake <= who.stack;
  const stake = el("button", "primary");
  stake.append(el("span", null, t(again ? "bank.stakeAgain" : "bank.stake")));
  if (again) stake.append(el("span", "n", fmt(who.lastStake)));
  stake.onclick = () => again ? act({ type: "stake", amount: who.lastStake }) : openStake();
  nodes.push(stake);
  if (again) nodes.push(action(t("sit.other"), () => openStake()));
  return nodes;
}

/**
 * Call, raise, fold. What a call costs is the one number nobody at a real table
 * agrees on, so the button carries it.
 */
function pokerActions(who) {
  if (who.folded) {
    const note = el("div", "note");
    note.append(el("span", "bang"), el("span", "txt", t("poker.folded")));
    return [note];
  }
  const owed = toCall(who);
  const first = el("button", "primary");
  if (owed > 0) {
    const label = el("span", null);
    fill(label, "poker.call", num(fmt(Math.min(owed, who.stack))));
    first.append(label);
    first.onclick = () => act({ type: "bet", amount: Math.min(owed, who.stack), pot: "main" });
    first.disabled = who.stack <= 0;
  } else {
    first.append(el("span", null, t("poker.bet")));
    first.onclick = () => openBet();
  }
  // With nothing owed the big button already is the bet; and whoever cannot
  // even cover the call has no raise to make, only the all-in call.
  const row = el("div", "row");
  if (owed > 0 && who.stack > owed) row.append(action(t("poker.raise"), () => openRaise(owed)));
  row.append(action(t("poker.fold"), () => act({ type: "fold" }), "danger"));
  return [first, row];
}

/**
 * A raise starts from the call — those chips go in either way — and is only
 * a raise once it goes over it. Under that, the balance line says what the
 * least raise is, rather than leave a greyed-out button to explain itself.
 */
function openRaise(owed) {
  const who = mine();
  openAmount({
    title: t("poker.raise"), sub: ["poker.raiseSub", num(fmt(owed))],
    confirm: t("poker.raise"), initial: owed, max: who.stack,
    poker: { raise: true, roundBet: who.roundBet || 0 },
    // Where the raise leaves you against the others; the stack is above.
    rest: (value) => value <= owed
      ? { label: t("poker.raiseMin"), value: owed + 1, bad: true }
      : { label: t("poker.betTotal"), value: (who.roundBet || 0) + value, bad: value > who.stack },
    run: (value) => act({ type: "bet", amount: value, pot: "main" })
  });
}

function openStake() {
  const who = mine();
  openAmount({
    title: t("bank.stakeTitle"), sub: ["bet.sub", num(fmt(who.stack))],
    confirm: t("bank.stake"), max: who.stack,
    initial: who.stake > 0 ? undefined : state.config.defaultBuyIn / 10 | 0,
    rest: (value) => ({ label: t("amount.remaining"), value: who.stack - value,
                        bad: value > who.stack }),
    run: (value) => act({ type: "stake", amount: value })
  });
}

function action(label, onClick, className) {
  const button = el("button", "secondary" + (className ? " " + className : ""), label);
  button.onclick = onClick;
  return button;
}

// ---------------------------------------------------------------- amount view
let flow = null;
let typed = "";
// A suggested amount is a suggestion: the first key typed replaces it instead
// of growing it, which is what anybody who wants 500 rather than 1000 expects.
let untouched = false;

function openAmount(next) {
  flow = next;
  chipCounts = null;
  padFresh = true;
  typed = next.initial === undefined ? "" : String(next.initial);
  untouched = typed !== "";
  showView("amount");
}

function typeIn(text) {
  if (untouched) { typed = ""; untouched = false; }
  if (typed.length + text.length <= 9) typed = (typed === "0" ? "" : typed) + text;
  renderAmount();
  buzz();
}

function setAmount(value) {
  typed = String(Math.max(0, Math.round(value)));
  untouched = false;
  renderAmount();
  buzz();
}

function amountValue() { return typed === "" ? 0 : Math.min(Number(typed), 999999999); }

function openBet() {
  const pot = currentPot();
  openAmount({
    title: t("bet.title"), sub: ["bet.sub", num(fmt(mine().stack))],
    confirm: t("bet.confirm"), max: mine().stack, potRelative: true,
    poker: mode === "poker" ? { raise: false, roundBet: mine().roundBet || 0 } : null,
    // At poker what matters is where the bet leaves you against the others;
    // the stack is in the line above.
    rest: (value) => mode === "poker"
      ? { label: t("poker.betTotal"), value: (mine().roundBet || 0) + value, bad: value > mine().stack }
      : { label: t("amount.remaining"), value: mine().stack - value, bad: value > mine().stack },
    run: (value) => act({ type: "bet", amount: value, pot: pot.id })
  });
}

function openRebuy() {
  openAmount({
    title: t("rebuy.title"), sub: ["rebuy.sub", num(fmt(mine().stack))],
    dealt: true,
    confirm: t("rebuy.confirm"), initial: state.config.defaultBuyIn,
    rest: (value) => ({ label: t("amount.resulting"), value: mine().stack + value }),
    run: (value) => act({ type: "rebuy", amount: value })
  });
}

function askBuyIn(seat) {
  // Coming back with chips is not a buy-in: sit straight down with them.
  const who = mine();
  if (who && who.stack > 0) {
    send({ type: "sit", seat: seat, buyIn: 0 });
    return;
  }
  openAmount({
    title: t("sit.title"),
    dealt: true,
    sub: ["sit.sub", num(seat === null ? "\u2014" : fmt(seat + 1)),
          num(fmt(state.config.defaultBuyIn))],
    confirm: t("sit.confirm"), initial: state.config.defaultBuyIn, allowZero: true,
    rest: (value) => ({ label: t("amount.resulting"), value: value }),
    run: (value) => send({ type: "sit", seat: seat, buyIn: value })
  });
}

function renderAmount() {
  if (!flow) { showView("table"); return; }
  const value = amountValue();
  document.getElementById("amountTitle").textContent = flow.title;
  const sub = document.getElementById("amountSub");
  if (Array.isArray(flow.sub)) fill(sub, ...flow.sub);
  else sub.replaceChildren(flow.sub || "");
  figure(document.getElementById("amountValue"), fmt(value));

  const rest = flow.rest ? flow.rest(value) : null;
  document.getElementById("restLabel").textContent = rest ? rest.label : "";
  const restValue = document.getElementById("restValue");
  restValue.textContent = rest ? fmt(rest.value) : "";
  restValue.style.color = rest && rest.bad ? "var(--loss)" : "var(--text)";

  document.getElementById("amountOkLabel").textContent = flow.confirm;
  document.getElementById("amountOkValue").textContent = fmt(value);
  document.getElementById("amountOk").disabled =
    (rest && rest.bad) || (value <= 0 && !flow.allowZero);

  renderAmountMode();
  if (byChips) {
    renderChipPad();
  } else {
    renderQuick();
    renderKeypad();
  }
}

// ---------------------------------------------------------------- chip by chip

// Whoever counts in chips keeps counting in chips: it is a way of playing.
let byChips = store.get("amountByChips") === "1";
// The rows are the truth while the pad is open; null means "start again from
// the amount", in the fewest chips, which is how a bet is pushed — or, for a
// buy-in (`flow.dealt`), the way the chips are dealt: five of each.
let chipCounts = null;
// A new amount opens the pad at its top, with the biggest chip in view. It is
// reset on the first draw rather than when the flow opens: the view is still
// hidden then, and a hidden element keeps its old scroll offset regardless.
let padFresh = false;

/** The same as `fewestChips` in :core: largest first. */
function fewestChips(amount) {
  let rest = Math.max(0, amount);
  return DENOMINATIONS.map((value) => {
    const count = Math.floor(rest / value);
    rest -= count * value;
    return { value: value, count: count };
  });
}

function padChips(amount) { return flow.dealt ? chipsIn(amount) : fewestChips(amount); }

function chipTotal(counts) { return counts.reduce((sum, c) => sum + c.value * c.count, 0); }

function renderAmountMode() {
  const pills = [[false, "amount.byNumber"], [true, "amount.byChips"]].map(([value, key]) => {
    const pill = el("button", byChips === value ? "on" : null, t(key));
    pill.onclick = () => {
      if (byChips === value) return;
      byChips = value;
      store.set("amountByChips", value ? "1" : "0");
      chipCounts = null;
      renderAmount();
    };
    return pill;
  });
  document.getElementById("amountMode").replaceChildren(...pills);
  document.getElementById("quickBlock").hidden = byChips;
  document.getElementById("keypad").hidden = byChips;
  document.getElementById("chipPad").hidden = !byChips;
}

/**
 * The amount as chips pushed forward, one row per value. The figure above is
 * always the total, and it is the total that is confirmed: the app counts
 * amounts, not chips.
 */
function renderChipPad() {
  const value = amountValue();
  if (!chipCounts || chipTotal(chipCounts) !== value) chipCounts = padChips(value);
  const max = flow.max === undefined || flow.max === null ? null : flow.max;
  const lines = chipCounts.map(({ value: chip, count }) => {
    const line = el("div", "chipLine");
    const less = el("button", null, "\u2212");
    less.disabled = count === 0;
    less.setAttribute("aria-label", t("amount.chipLess", fmt(chip)));
    less.onclick = () => changeChip(chip, -1);
    const more = el("button", null, "+");
    more.disabled = max !== null && value + chip > max;
    more.setAttribute("aria-label", t("amount.chipMore", fmt(chip)));
    more.onclick = () => changeChip(chip, 1);
    line.append(el("i", "sw v" + chip), el("span", "v", fmt(chip)), less,
                el("span", "c" + (count ? "" : " zero"), fmt(count)), more);
    return line;
  });
  const row = el("div", "row");
  const clear = el("button", "quick rel", t("amount.clear"));
  clear.onclick = () => { chipCounts = padChips(0); setAmount(0); };
  row.append(clear);
  if (max !== null) {
    const all = el("button", "quick rel all", t("amount.all"));
    all.onclick = () => { chipCounts = padChips(max); setAmount(max); };
    row.append(all);
  }
  const pad = document.getElementById("chipPad");
  pad.replaceChildren(...lines, row);
  if (padFresh) { pad.scrollTop = 0; padFresh = false; }
}

function changeChip(chip, by) {
  chipCounts = chipCounts.map((c) => (c.value === chip ? { value: c.value, count: c.count + by } : c));
  setAmount(chipTotal(chipCounts));
}

function renderQuick() {
  const add = (amount) => {
    const button = el("button", "quick n add", "+" + fmt(amount));
    button.onclick = () => setAmount(amountValue() + amount);
    return button;
  };
  const set = (label, amount, className) => {
    const button = el("button", "quick rel" + (className ? " " + className : ""), label);
    button.onclick = () => setAmount(amount);
    return button;
  };
  const cap = (amount) => (flow.max ? Math.min(flow.max, amount) : amount);
  const sizes = flow.poker;
  const nodes = [];
  if (sizes && sizes.raise) {
    // A raise is sized in multiples of the bet it raises; the amount is what
    // goes in now, so twice the bet less what is already in front of you.
    nodes.push(...[2, 3].map((times) => set("\u00d7" + times, cap(state.currentBet * times - sizes.roundBet))),
               set(t("amount.pot"), cap(potTotal())), set(t("amount.all"), flow.max || 0, "all"));
  } else if (sizes && state.config.bigBlind > 0) {
    // A bet is sized in big blinds, or against the pot.
    const pot = currentPot().amount;
    nodes.push(...[2, 3].map((times) => set(fmt(state.config.bigBlind * times), cap(state.config.bigBlind * times))),
               set(t("amount.halfPot"), cap(Math.floor(pot / 2))), set(t("amount.pot"), cap(pot)),
               set(t("amount.all"), flow.max || 0, "all"));
  } else if (flow.potRelative) {
    const pot = currentPot().amount;
    nodes.push(add(5), add(25), add(100),
               set(t("amount.halfPot"), Math.floor(pot / 2)),
               set(t("amount.pot"), pot),
               set(t("amount.all"), flow.max || 0, "all"));
  } else {
    // No "pot" here: this is not a bet against a pot (a stake, a buy-in, a
    // correction), and offering one where there is none sets a meaningless 0.
    nodes.push(add(5), add(25), add(100),
               add(500), set(t("amount.all"), flow.max || state.config.defaultBuyIn, "all"));
  }
  document.getElementById("quick").replaceChildren(...nodes);
}

function renderKeypad() {
  const pad = document.getElementById("keypad");
  if (pad.childElementCount) return;   // the keypad never changes: build it once
  const digit = (label) => {
    const button = el("button", "key" + (label.length > 1 ? " small" : ""), label);
    button.onclick = () => typeIn(label);
    return button;
  };
  const back = el("button", "key");
  const box = el("div", "del");
  const a = el("i"); a.style.transform = "rotate(45deg)";
  const b = el("i"); b.style.transform = "rotate(-45deg)";
  box.append(a, b);
  back.append(box);
  back.onclick = () => { untouched = false; typed = typed.slice(0, -1); renderAmount(); buzz(); };
  pad.replaceChildren(...["1","2","3","4","5","6","7","8","9","00","0"].map(digit), back);
}

// ---------------------------------------------------------------- host panel
let pendingSplit = null;

function renderHost() {
  fill(document.getElementById("hostSub"), "hostPanel.sub",
       num(fmt(seatedPlayers().length)), num(fmt(potTotal())));
  const pot = currentPot();
  document.getElementById("awardCap").textContent = pendingSplit === null
    ? t("hostPanel.awardPot")
    : t("hostPanel.awardPart", fmt(pendingSplit));
  figure(document.getElementById("awardPot"), fmt(pot ? pot.amount : 0));

  const amount = pendingSplit === null ? (pot ? pot.amount : 0) : pendingSplit;
  if (tying && tying.pot !== (pot && pot.id)) tying = null;
  // More than one pot: which one is being given is picked here, where it is
  // given, not back on the table.
  const potPills = document.getElementById("awardPots");
  potPills.hidden = state.pots.length < 2;
  potPills.replaceChildren(...(state.pots.length < 2 ? [] : state.pots.map((each) => {
    const pill = el("button", "pill" + (pot && each.id === pot.id ? " on" : ""),
                    potName(each) + " \u00b7 " + fmt(each.amount));
    pill.onclick = () => { selectedPot = each.id; pendingSplit = null; tying = null; render(); };
    return pill;
  })));
  const winners = pot ? eligibleFor(pot) : seatedPlayers();
  const rows = winners.map((who) => {
    if (tying) {
      const picked = tying.players.includes(who.id);
      const button = el("button", "awardBtn" + (picked ? " picked" : ""),
                        (picked ? "\u2713 " : "") + who.name);
      button.disabled = amount <= 0;
      button.onclick = () => {
        tying.players = picked ? tying.players.filter((id) => id !== who.id) : tying.players.concat(who.id);
        render();
      };
      return button;
    }
    const button = el("button", "awardBtn");
    button.append(el("span", null, t("hostPanel.wins", who.name)), el("span", "g", signed(amount)));
    button.disabled = amount <= 0;
    button.onclick = () => {
      const whole = pendingSplit === null;
      hostCommand({ type: "award_pot", to: who.id, pot: pot.id, amount: whole ? null : pendingSplit });
      pendingSplit = null;
      if (whole && handOverAfter(pot)) showView("table");
    };
    return button;
  });
  document.getElementById("awardRows").replaceChildren(...rows);
  document.getElementById("tieHint").hidden = !tying;
  document.getElementById("awardTools").hidden = !!tying;
  document.getElementById("tieTools").hidden = !tying;
  document.getElementById("tieBtn").hidden = winners.length < 2 || pendingSplit !== null;
  document.getElementById("tieBtn").disabled = !pot || pot.amount <= 0;
  const tieOk = document.getElementById("tieOk");
  tieOk.textContent = t("hostPanel.tieConfirm", fmt(tying ? tying.players.length : 0));
  tieOk.disabled = !tying || tying.players.length < 2;

  const playerRows = state.players.map((who) => {
    const row = el("div", "hrow");
    const block = el("div", "who");
    block.append(el("div", "n", who.name));
    const broke = who.seat !== null && who.stack === 0;
    const stackLine = el("div", "s" + (broke ? " broke" : ""));
    if (broke) fill(stackLine, "hostPanel.noChips", num(fmt(0)));
    else stackLine.append(el("span", "num", fmt(who.stack)));
    block.append(stackLine);
    row.append(block);
    const give = el("button", "rowBtn" + (broke ? " want" : ""), t("hostPanel.give"));
    give.onclick = () => openAmount({
      title: t("give.title", who.name), sub: ["player.stackIs", num(fmt(who.stack))],
      confirm: t("give.confirm"),
      initial: state.config.defaultBuyIn,
      rest: (value) => ({ label: t("amount.resulting"), value: who.stack + value }),
      run: (value) => hostCommand({ type: "adjust_stack", player: who.id, delta: value }),
      back: "host"
    });
    const take = el("button", "rowBtn danger", t("hostPanel.take"));
    take.onclick = () => openAmount({
      title: t("take.title", who.name), sub: ["player.stackIs", num(fmt(who.stack))],
      confirm: t("take.confirm"),
      max: who.stack,
      rest: (value) => ({ label: t("amount.resulting"), value: who.stack - value,
                          bad: value > who.stack }),
      run: (value) => hostCommand({ type: "adjust_stack", player: who.id, delta: -value }),
      back: "host"
    });
    row.append(give, take);
    return row;
  });
  document.getElementById("hostRows").replaceChildren(...playerRows);
  renderSeatAdmin();
  renderHands();
  renderPokerPanel();
  renderGameSettings();

  fill(document.getElementById("buyInBtn"), "hostPanel.buyInNow",
       num(fmt(state.config.defaultBuyIn)));
}

/**
 * The bank's side of a hand: one row per player with chips up, and the four
 * ways it can end. The app never sees the cards, so this is the host saying
 * what happened, not the app deciding it.
 */
function renderHands() {
  const block = document.getElementById("handsBlock");
  block.hidden = !bankGame();
  if (block.hidden) return;
  const rows = [];
  const held = banker();
  const bank = el("div", "hrow");
  const bankWho = el("div", "who");
  bankWho.append(el("div", "n", t(mode === "blackjack" ? "poker.button" : "bank.title")));
  bankWho.append(el("div", "s", held ? held.name : t("bank.none")));
  bank.append(bankWho);
  const pass = el("button", "rowBtn", t(held ? "bank.change" : "bank.assign"));
  pass.onclick = () => { pickingBanker = !pickingBanker; renderHands(); };
  bank.append(pass);
  rows.push(bank);
  if (pickingBanker) {
    document.getElementById("handRows").replaceChildren(bank, ...bankerPicker());
    return;
  }

  // The hands themselves are settled on the table, where the bank is.
  document.getElementById("handRows").replaceChildren(...rows);
}

/** The bank row opens into the names it can be handed to, and to nobody. */
let pickingBanker = false;

function bankerPicker() {
  const rows = [];
  seatedPlayers().forEach((who) => {
    const row = el("div", "hrow");
    const block = el("div", "who");
    block.append(el("div", "n", who.name));
    const line = el("div", "s");
    line.append(el("span", "num", fmt(who.stack)));
    block.append(line);
    row.append(block);
    const take = el("button", "rowBtn" + (state.banker === who.id ? " want" : ""), t("bank.give"));
    take.onclick = () => {
      pickingBanker = false;
      hostCommand({ type: "set_banker", player: who.id });
    };
    row.append(take);
    rows.push(row);
  });
  const none = el("button", "secondary", t("bank.none"));
  none.style.cssText = "height:48px;font-size:14px";
  none.onclick = () => {
    pickingBanker = false;
    hostCommand({ type: "set_banker", player: null });
  };
  rows.push(none);
  return rows;
}

/** Running a hand of poker: the button, the streets, and the side pots. */
/**
 * Whether giving away the whole of this pot ends the hand: nothing left in any
 * other. The host is then done in the panel and goes back to the table, where
 * the next hand has already been dealt.
 */
function handOverAfter(pot) {
  return mode === "poker" && !state.pots.some((each) => each.id !== pot.id && each.amount > 0);
}

// Picking the players who tied, rather than the one who won: { pot, players }.
let tying = null;

function renderPokerPanel() {
  const block = document.getElementById("pokerBlock");
  block.hidden = mode !== "poker";
  if (block.hidden) return;
  const rows = [];
  const newHand = el("button", "secondary", t("poker.newHand"));
  newHand.style.cssText = "height:52px;font-size:15px";
  newHand.onclick = () => hostCommand({ type: "start_hand" });
  rows.push(newHand);

  const pair = el("div", "row");
  const close = el("button", "secondary", t("poker.closeRound"));
  close.style.cssText = "height:52px;font-size:14px";
  close.onclick = () => hostCommand({ type: "close_round" });
  const split = el("button", "secondary", t("poker.split"));
  split.style.cssText = "height:52px;font-size:14px";
  split.onclick = () => hostCommand({ type: "split_pots" });
  pair.append(close, split);
  rows.push(pair);

  const blinds = el("button", "secondary");
  blinds.style.cssText = "height:52px;font-size:14px";
  fill(blinds, "poker.blindsNow", num(fmt(state.config.smallBlind)), num(fmt(state.config.bigBlind)));
  blinds.onclick = () => askBlinds();
  rows.push(blinds);
  document.getElementById("pokerRows").replaceChildren(...rows);
}

function askBlinds() {
  openAmount({
    title: t("poker.blinds"), sub: ["poker.blindsSub"],
    confirm: t("buyIn.confirm"),
    initial: state.config.bigBlind || (state.config.defaultBuyIn / 50 | 0),
    allowZero: true,
    rest: (value) => ({ label: t("poker.blinds"), value: value / 2 | 0 }),
    // One number to type: the big blind. The small one is half of it, which is
    // what it is at every table that does not say otherwise.
    run: (value) => hostCommand({
      type: "set_config",
      config: Object.assign({}, state.config, { bigBlind: value, smallBlind: value / 2 | 0 })
    }),
    back: "host"
  });
}

/** Which game this table is playing, and the one setting that game needs. */
function renderGameSettings() {
  const pills = ["manual", "seven_half", "blackjack", "poker"].map((name) => {
    const pill = el("button", "pill" + (mode === name ? " on" : ""), t("mode." + name));
    pill.onclick = () => {
      if (mode === name) return;
      hostCommand({ type: "set_config", config: Object.assign({}, state.config, { mode: name }) });
    };
    return pill;
  });
  document.getElementById("modePills").replaceChildren(...pills);

  const rows = [];
  if (bankGame()) {
    const cap = el("div", "cap", t("bank.pays"));
    rows.push(cap);
    const row = el("div", "pills");
    [[1, 1], [3, 2], [2, 1]].forEach(([numerator, denominator]) => {
      const pays = state.config.naturalPays || { numerator: 3, denominator: 2 };
      const on = pays.numerator === numerator && pays.denominator === denominator;
      const pill = el("button", "pill" + (on ? " on" : ""), numerator + ":" + denominator);
      pill.onclick = () => hostCommand({
        type: "set_config",
        config: Object.assign({}, state.config, {
          naturalPays: { numerator: numerator, denominator: denominator }
        })
      });
      row.append(pill);
    });
    rows.push(row);
  }
  if (mode === "seven_half") {
    rows.push(el("div", "cap", t("bank.naturalTakes")));
    const row = el("div", "pills");
    [[true, "common.yes"], [false, "common.no"]].forEach(([value, key]) => {
      const pill = el("button", "pill" + (!!state.config.naturalTakesBank === value ? " on" : ""), t(key));
      pill.onclick = () => hostCommand({
        type: "set_config", config: Object.assign({}, state.config, { naturalTakesBank: value })
      });
      row.append(pill);
    });
    rows.push(row);
  }
  document.getElementById("gameSettings").replaceChildren(...rows);
}

/**
 * The two things the rules cannot fix by themselves: a phone that is never
 * coming back, and somebody who should not be at the table any more.
 *
 * Handing a seat over moves the chips with it — it is a change of who holds
 * them, not a payout — so the table stays balanced either way.
 */
let giving = null;

function renderSeatAdmin() {
  const seated = state.players.filter((who) => who.seat !== null)
    .sort((a, b) => a.seat - b.seat);
  const chosen = giving && seated.find((who) => who.id === giving);
  const cap = document.getElementById("seatsCap");
  if (chosen) fill(cap, "seats.to", chosen.name);
  else cap.textContent = t("seats.title");

  let rows;
  if (chosen) {
    const standing = state.players.filter((who) => who.seat === null);
    if (!standing.length) {
      const note = el("div", "note");
      note.append(el("span", "bang"), el("span", "txt", t("seats.none")));
      rows = [note];
    } else {
      rows = standing.map((who) => {
        const row = el("div", "hrow");
        const block = el("div", "who");
        block.append(el("div", "n", who.name));
        const line = el("div", "s");
        line.append(el("span", "num", fmt(chosen.stack)));
        block.append(line);
        row.append(block);
        const take = el("button", "rowBtn", t("seats.take"));
        take.onclick = () => {
          if (!confirm(t("seats.confirm", who.name, chosen.name))) return;
          hostCommand({ type: "transfer_seat", from: chosen.id, to: who.id });
          giving = null;
          renderSeatAdmin();
        };
        row.append(take);
        return row;
      });
    }
    const back = el("button", "secondary", t("log.back"));
    back.style.height = "48px";
    back.onclick = () => { giving = null; renderSeatAdmin(); };
    rows.push(back);
  } else {
    rows = seated.map((who) => {
      const row = el("div", "hrow");
      const block = el("div", "who");
      block.append(el("div", "n", who.name));
      const line = el("div", "s" + (who.connected ? "" : " broke"));
      line.append(el("span", "num", fmt(who.stack)));
      if (!who.connected) line.append(document.createTextNode(" \u00B7 " + t("seats.offline")));
      block.append(line);
      row.append(block);
      const hand = el("button", "rowBtn", t("seats.hand"));
      hand.onclick = () => { giving = who.id; renderSeatAdmin(); };
      row.append(hand);
      if (!who.isHost) {
        const out = el("button", "rowBtn danger", t("seats.out"));
        out.onclick = () => {
          if (!confirm(t("kick.confirm", who.name))) return;
          hostCommand({ type: "kick", player: who.id });
        };
        row.append(out);
      }
      return row;
    });
  }
  document.getElementById("seatRows").replaceChildren(...rows);
}

// ---------------------------------------------------------------- chips

// The same breakdown as `chipsIn` in :core, so both screens draw the same
// stack. The cases in ChipsTest are checked against this copy too.
const DENOMINATIONS = [100, 50, 25, 5, 1];
const CHIPS_PER_DENOMINATION = 5;
const MAX_EDGES = 7;

/**
 * A stack as a player at a real table would hold it: up to five of each small
 * chip — what a deal gives — and everything above that in the biggest one.
 * A picture of the number, never a claim about what is on the felt.
 */
function chipsIn(amount) {
  const ascending = DENOMINATIONS.slice().sort((a, b) => a - b);
  const counts = {};
  let rest = Math.max(0, amount);
  ascending.forEach((value, index) => {
    const next = ascending[index + 1];
    let count;
    if (next === undefined) {
      count = Math.floor(rest / value);
    } else {
      const group = next / value;
      count = (rest % next) / value;
      while (count + group <= CHIPS_PER_DENOMINATION && (count + group) * value <= rest) count += group;
    }
    counts[value] = count;
    rest -= count * value;
  });
  return DENOMINATIONS.map((value) => ({ value: value, count: counts[value] }));
}

function renderChips(node, amount) {
  const columns = chipsIn(amount).map(({ value, count }) => {
    const column = el("div", "chipCol" + (count === 0 ? " empty" : ""));
    const pile = el("div", "chipPile");
    if (count === 0) pile.append(el("i", "none"));
    for (let i = 0; i < Math.min(count, MAX_EDGES); i++) pile.append(el("i", "v" + value));
    column.append(pile, el("div", "cv", fmt(value)), el("div", "cc", "\u00D7" + fmt(count)));
    return column;
  });
  node.replaceChildren(...columns);
}

// ---------------------------------------------------------------- rules

/**
 * How the game on this table is played, what the app does about it, and what
 * it leaves to the people sitting there — whose turn it is and who won are
 * theirs. With this table's own numbers: the house rules are half the argument.
 */
function renderRules() {
  const config = state.config;
  document.getElementById("rulesSub").textContent = t("mode." + mode);
  document.getElementById("rulesPlay").textContent = t("rules." + mode + ".play");
  document.getElementById("rulesCount").textContent = t("rules." + mode + ".count");
  document.getElementById("rulesPeople").textContent = t("rules." + mode + ".people");
  renderHandRankings();
  const lines = [t("rules.buyIn", fmt(config.defaultBuyIn)), t("rules.seats", fmt(config.seatCount))];
  if (bankGame()) {
    const pays = config.naturalPays || { numerator: 3, denominator: 2 };
    lines.push(t("rules.natural", pays.numerator + ":" + pays.denominator));
    if (mode === "seven_half" && config.naturalTakesBank) lines.push(t("rules.naturalTakes"));
    if (mode === "blackjack") lines.push(t("rules.house", fmt(state.house || 0)));
  }
  if (mode === "poker") {
    lines.push(config.bigBlind > 0
      ? t("rules.blinds", fmt(config.smallBlind), fmt(config.bigBlind))
      : t("rules.noBlinds"));
  }
  document.getElementById("rulesValues").replaceChildren(...lines.map((line) => el("div", null, line)));
}

/** Highest first. The example cards read the same in every language. */
const HANDS = [
  ["royal_flush", "A♠ K♠ Q♠ J♠ 10♠"],
  ["straight_flush", "9♥ 8♥ 7♥ 6♥ 5♥"],
  ["four_kind", "Q♣ Q♦ Q♥ Q♠ 7♦"],
  ["full_house", "8♠ 8♥ 8♦ K♣ K♥"],
  ["flush", "K♦ 10♦ 7♦ 4♦ 2♦"],
  ["straight", "7♣ 6♦ 5♠ 4♥ 3♣"],
  ["three_kind", "9♠ 9♥ 9♦ K♣ 4♠"],
  ["two_pair", "J♥ J♣ 4♦ 4♠ A♥"],
  ["pair", "10♠ 10♦ K♥ 6♣ 3♦"],
  ["high_card", "A♣ J♦ 8♥ 6♠ 2♣"]
];

/**
 * Which hand beats which, and the ties that start arguments: near the top of
 * the poker rules, because it is what gets looked up mid-hand, and a hotspot
 * has no internet to look it up on.
 */
function renderHandRankings() {
  const block = document.getElementById("rulesHands");
  block.hidden = mode !== "poker";
  if (block.hidden) return;
  const list = el("div", "ruleCard");
  list.append(el("div", "hd", t("hands.sub")));
  HANDS.forEach(([key, cards], index) => {
    const row = el("div", "handRow");
    const body = el("div");
    const shown = el("div", "cards");
    cards.split(" ").forEach((card) => {
      const red = card.endsWith("\u2665") || card.endsWith("\u2666");
      shown.append(el("span", red ? "red" : null, card));
    });
    body.append(el("div", "hn", t("hand." + key)), shown, el("div", "hd", t("hand." + key + ".desc")));
    row.append(el("span", "rank", String(index + 1)), body);
    list.append(row);
  });
  const notes = el("div", "ruleCard handNotes");
  [1, 2, 3, 4, 5].forEach((n) => notes.append(el("div", null, t("hands.note" + n))));
  block.replaceChildren(el("div", "cap", t("hands.title")), list,
                        el("div", "cap", t("hands.ties")), notes);
}

// ---------------------------------------------------------------- log


function logArgs(args) {
  const out = {};
  for (const [name, value] of Object.entries(args || {})) {
    if (name === "pot") {
      const pot = state.pots.find((p) => p.id === value);
      out[name] = pot ? potName(pot) : value;
    } else if (name === "amount" || name === "buyIn") {
      out[name] = fmt(value);
    } else {
      out[name] = value;
    }
  }
  return out;
}

/** How many chips an entry moved, from the table's point of view. */
const DELTA = {
  "log.bet": -1, "log.player_sat": 0, "log.rebuy": 1, "log.pot_awarded": 1,
  "log.stack_added": 1, "log.stack_removed": -1, "log.transfer": -1
};

function renderLog() {
  fill(document.getElementById("logSub"), "log.sub", num(fmt(state.rev)));
  const last = state.log[state.log.length - 1];
  const canUndo = iAmHost() && undoDepth > 0 && last;
  document.getElementById("logUndo").hidden = !canUndo;
  if (canUndo) fillEntry(document.getElementById("logUndoWhat"), last);

  const entries = state.log.slice().reverse();
  const rows = entries.map((entry, index) => {
    const row = el("div", "entry");
    // Older lines fade, which gives depth without adding a single colour.
    row.style.opacity = index < 6 ? "1" : (index < 14 ? ".62" : ".45");
    const when = new Date(entry.at);
    row.append(el("span", "when",
      String(when.getHours()).padStart(2, "0") + ":" + String(when.getMinutes()).padStart(2, "0")));
    const what = el("span", "what");
    fillEntry(what, entry);
    row.append(what);
    const sign = DELTA[entry.key];
    const amount = Number(entry.args && (entry.args.amount || entry.args.buyIn));
    if (sign && amount) {
      row.append(el("span", "d " + (sign > 0 ? "up" : "down"), signed(sign * amount)));
    } else {
      row.append(el("span", "d none", "—"));
    }
    return row;
  });
  document.getElementById("logRows").replaceChildren(...rows);
}

// ---------------------------------------------------------------- wiring
const nameField = document.getElementById("name");
nameField.value = store.get("name") || "";
const doJoin = () => {
  const name = nameField.value.trim();
  if (name) join(name); else showError(t("error.name_required"));
};
document.getElementById("joinBtn").onclick = doJoin;
nameField.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doJoin(); } });

document.getElementById("menuBtn").onclick = () => { document.getElementById("menu").hidden = false; };
document.getElementById("mClose").onclick = () => { document.getElementById("menu").hidden = true; };
document.getElementById("menu").onclick = (event) => {
  if (event.target.id === "menu") document.getElementById("menu").hidden = true;
};
document.getElementById("mHost").onclick = () => showView("host");
document.getElementById("mLog").onclick = () => showView("log");
document.getElementById("mStand").onclick = () => { act({ type: "stand_up" }); showView("table"); };
document.getElementById("mLeave").onclick = () => {
  if (!confirm(t("leave.confirm"))) return;
  send({ type: "leave" });
  store.remove("playerId");
  state = null; me = null; lastRev = 0; undoBar = null;
  showView("join");
};

document.getElementById("amountCancel").onclick = () => showView(flow && flow.back || "table");
document.getElementById("amountBack").onclick = () => showView(flow && flow.back || "table");
document.getElementById("amountOk").onclick = () => {
  const value = amountValue();
  const back = flow.back || "table";
  flow.run(value);
  flow = null;
  showView(back);
};

document.getElementById("hostBack").onclick = () => showView("table");
document.getElementById("hostDoneBtn").onclick = () => showView("table");
document.getElementById("hostLogBtn").onclick = () => showView("log");
document.getElementById("logBack").onclick = () => showView("table");
document.getElementById("logDone").onclick = () => showView("table");
document.getElementById("rulesBtn").onclick = () => showView("rules");

// A new name is kept on this device too: every reconnection repeats the join
// with the stored name, which would otherwise rename the player back.
const renameField = document.getElementById("renameField");
function saveName() {
  const name = renameField.value.trim();
  if (!name) return;
  store.set("name", name);
  act({ type: "rename", name: name });
  showView("table");
}
document.getElementById("mRename").onclick = () => {
  renameField.value = (mine() && mine().name) || store.get("name") || "";
  showView("name");
  renameField.focus();
};
document.getElementById("renameSave").onclick = saveName;
renameField.onkeydown = (event) => { if (event.key === "Enter") saveName(); };
document.getElementById("nameBack").onclick = () => showView("table");
document.getElementById("rulesBack").onclick = () => showView("table");
document.getElementById("rulesDone").onclick = () => showView("table");
document.getElementById("logUndoBtn").onclick = () => hostCommand({ type: "undo" });
document.getElementById("undoBarBtn").onclick = () => { hostCommand({ type: "undo" }); undoBar = null; };

document.getElementById("splitBtn").onclick = () => {
  const pot = currentPot();
  openAmount({
    title: t("split.title"), sub: ["split.sub", num(fmt(pot.amount))], confirm: t("split.confirm"),
    max: pot.amount,
    rest: (value) => ({ label: t("amount.remaining"), value: pot.amount - value,
                        bad: value > pot.amount }),
    run: (value) => { pendingSplit = value; },
    back: "host"
  });
};
document.getElementById("tieBtn").onclick = () => { tying = { pot: currentPot().id, players: [] }; render(); };
document.getElementById("tieCancel").onclick = () => { tying = null; render(); };
document.getElementById("tieOk").onclick = () => {
  const pot = currentPot();
  hostCommand({ type: "share_pot", winners: tying.players, pot: pot.id });
  tying = null;
  if (handOverAfter(pot)) showView("table"); else render();
};
document.getElementById("newPotBtn").onclick = () =>
  hostCommand({ type: "create_pot", name: t("newPot.name") });
document.getElementById("buyInBtn").onclick = () => openAmount({
  title: t("buyIn.title"), sub: t("buyIn.sub"), confirm: t("buyIn.confirm"),
  dealt: true,
  initial: state.config.defaultBuyIn, allowZero: true,
  rest: (value) => ({ label: t("hostPanel.buyIn"), value: value }),
  run: (value) => hostCommand({
    type: "set_config",
    config: { mode: state.config.mode, seatCount: state.config.seatCount, defaultBuyIn: value }
  }),
  back: "host"
});

document.getElementById("joinRoom").textContent = "";
applyLanguage();
showView("join");
connect();
</script>
