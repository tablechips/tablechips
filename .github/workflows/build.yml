name: Build

# Every pull request builds and tests everything — the rules, the server, the
# app's screens rendered on the JVM, and an unsigned release APK — so the
# release PR is never the first place a broken build shows up.
on:
  pull_request:

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19
    # October 2026: the machine a build runs on changes when we say so.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The action's default list asks for "tools", which the SDK no longer
      # has: name the packages the build needs instead.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      # "basic" is the open-source cache on GitHub's own; the default,
      # "enhanced", is a commercial caching service this project does not need.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: tablechips-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
