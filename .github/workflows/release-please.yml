name: Release

# Automated releases with release-please, as in s7-opcua-bridge. On each push
# to main it keeps a "release PR" up to date, whose version comes from the
# Conventional Commit messages since the last release (fix: -> patch,
# feat: -> minor, feat!/BREAKING CHANGE -> major; below 1.0 a breaking change
# only bumps the minor). Merging that PR bumps version.txt, writes
# CHANGELOG.md, tags vX.Y.Z and creates the GitHub release; the apk job then
# builds the signed APK and attaches it. Both jobs run in one workflow, so no
# PAT is needed (a tag pushed with GITHUB_TOKEN would not trigger another).
#
# Run by hand with a tag, it skips release-please and only builds and
# attaches the APK of that existing release, replacing what is there: for a
# release whose APK step failed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release to build the APK for, e.g. v0.1.0"
        required: true

permissions:
  contents: write # create releases and tags, upload the APK
  pull-requests: write # maintain the release PR

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      # For the root package release-please names its outputs without a
      # path prefix.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  apk:
    needs: release-please
    # always(): on a manual run release-please is skipped, and a skipped
    # dependency would otherwise skip this job too.
    if: >-
      ${{ always() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The action's default list asks for "tools", which the SDK no longer
      # has: name the packages the build needs instead.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      # A release without a signed APK is worse than no release: stop here,
      # with the reason, rather than publish something nobody can install.
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TABLECHIPS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::TABLECHIPS_KEYSTORE_BASE64 is not set: see README, Releasing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          TABLECHIPS_KEYSTORE: ${{ runner.temp }}/release.jks
          TABLECHIPS_KEYSTORE_PASSWORD: ${{ secrets.TABLECHIPS_KEYSTORE_PASSWORD }}
          TABLECHIPS_KEY_ALIAS: ${{ secrets.TABLECHIPS_KEY_ALIAS }}
          TABLECHIPS_KEY_PASSWORD: ${{ secrets.TABLECHIPS_KEY_PASSWORD }}
        run: |
          version="$(cat version.txt)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not match version.txt ($version)."
            exit 1
          fi
          ./gradlew :app:assembleRelease

      # The APK goes up with its checksum, and the release notes say which
      # certificate signed it, so anybody can check a download is ours.
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="tablechips-$(cat version.txt).apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          # build-tools 36 prints "Signer #1 certificate SHA-256 digest: …",
          # 37 prints "V2 Signer: certificate SHA-256 digest: …": take the
          # digest after the label, whichever form it comes in.
          cert="$("$apksigner" verify --print-certs "$apk" \
            | sed -n -E 's/^.*[Ss]igner.*certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' \
            | head -n 1)"
          if [ -z "$cert" ]; then
            echo "::error::$apk is not signed."
            exit 1
          fi
          gh release upload "$TAG" "$apk" "$apk.sha256" --clobber
          {
            # Drop an Install section a previous run already appended, and
            # the blank lines before it.
            printf '%s\n\n' "$(gh release view "$TAG" --json body --jq .body | sed '/^### Install$/,$d')"
            echo "### Install"
            echo
            echo "Download \`$apk\` and open it on an Android phone (8.0 or newer)."
            echo "Guests do not need it: they join the table from their browser."
            echo
            echo "SHA-256 of the APK: \`$(cut -d' ' -f1 "$apk.sha256")\`"
            echo
            echo "Signing certificate SHA-256: \`$cert\`"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
