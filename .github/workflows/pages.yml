# Publishes site/ to GitHub Pages, at tablechips.github.io/tablechips until
# the project has a domain of its own. Pages has to be set to deploy from
# "GitHub Actions" in the repository settings once.
name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19
    # October 2026: the machine a build runs on changes when we say so.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
